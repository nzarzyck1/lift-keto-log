<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="21">
<title>Nathan's Lift & Keto Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1522" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone logbook, sticky header, fixed bottom tab bar; cards only for the active workout's exercises. */
/* Look: a quiet sanctuary clinic. Warm white paper, deep navy ink, clinical teal for data and actions, liturgical gold for hierarchy. Serif headings, plain sans body, mono readouts. Follows the phone's light or dark setting. */
:root{
  --bg:#f7f5f0; --surface:#ffffff; --sunk:#f2efe8; --ink:#16213a; --muted:#5d6676; --line:#e5e0d5;
  --accent:#17707a; --accent-ink:#ffffff; --accent-soft:#e2efee;
  --gold:#9c7a34; --gold-soft:#f5eedf;
  --protein:#c0503b; --carb:#b0721a; --fat:#3a68b0; --water:#1a86a8; --ketone:#8a3f9e;
  --good:#2b7a50; --warn:#a9650e; --bad:#bf3a2d;
  --shadow:0 1px 2px rgba(22,33,58,.05),0 8px 24px rgba(22,33,58,.06);
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:64px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1522; --surface:#151f30; --sunk:#111a29; --ink:#ece8de; --muted:#9ba4b4; --line:#26324a;
  --accent:#5cc4c4; --accent-ink:#052a2b; --accent-soft:#163a3d;
  --gold:#d8b76e; --gold-soft:#2a2516;
  --protein:#ff8f7f; --carb:#f5c15a; --fat:#8db3ff; --water:#62d0ea; --ketone:#d391ff;
  --good:#62d197; --warn:#f0ad4e; --bad:#ff6f6f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)));padding-right:max(16px,max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px)));padding-block:0 calc(var(--tabh) + 32px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)))}
header.top{position:sticky;top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
h1::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:10px;vertical-align:2px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
h2{font-size:22px;font-weight:600;letter-spacing:.02em}
h3{font-size:19px;font-weight:600}
.sync{font-size:12px;color:var(--muted);text-align:right}
.sync b{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--good)} .dot.off{background:var(--warn)}
.eyebrow{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
section.view{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
button.danger{color:var(--bad)}
button.armed{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
button.big{width:100%;font-size:18px;min-height:52px;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr 1fr}.grid4 .full{grid-column:1/-1}}

/* Next-up block */
.nextup{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%);color:var(--ink);border:1px solid var(--accent);box-shadow:0 0 24px rgba(53,230,189,.12) inset;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px}
.nextup .eyebrow{color:var(--accent)}
.nextup h2{font-size:36px;line-height:1;text-transform:uppercase}
.nextup .meta{font-size:14px;opacity:.85}
.nextup button.primary{background:var(--accent);border-color:var(--accent)}
.rotation{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rotation button{min-height:40px;padding:6px 4px;font-size:14px;background:transparent;color:var(--ink);border-color:var(--line)}
.rotation button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan-list li:last-child{border-bottom:0}
.plan-list .rx{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap}

/* Session */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.done{border-color:var(--accent)}
.ex .rx{font-family:var(--display);font-size:17px;font-weight:600;color:var(--accent)}
.last{font-size:14px;color:var(--muted)}
.hint{font-size:14px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.hint.up{font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.setrow .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.setrow input{text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.check{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:20px;border-radius:10px}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.unit{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{border:0;border-radius:0;min-height:38px;padding:6px 12px;font-size:14px;background:var(--surface)}
.toggle button.sel{background:var(--accent);color:var(--accent-ink)}
.phase{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}

/* Macros */
.bars{display:flex;flex-direction:column;gap:14px}
.bar .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar .lab b{font-family:var(--display);font-size:20px;font-weight:700}
.bar .track{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:4px;position:relative}
.bar .fill{height:100%;border-radius:6px;transition:width .3s}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.bar .note{font-size:13px;color:var(--muted);margin-top:3px}
.kcal{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.kcal b{color:var(--ink);font-family:var(--display);font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.chip small{font-size:11px;color:var(--muted);font-weight:500}
.foods{list-style:none;margin:0;padding:0}
.foods li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.foods .m{font-size:13px;color:var(--muted)}
.mac{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.mac .p{color:var(--protein)} .mac .c{color:var(--carb)} .mac .fa{color:var(--fat)}
.xbtn{min-height:36px;min-width:36px;padding:0;border:0;background:transparent;color:var(--muted);font-size:20px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{min-width:44px}
.water{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.water b{font-family:var(--display);font-size:22px;color:var(--water)}
.panel{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
td.ok{color:var(--good);font-weight:600} td.lo{color:var(--warn);font-weight:600} td.hi{color:var(--bad);font-weight:600}

/* Log */
details.sess{border-bottom:1px solid var(--line);padding:10px 0}
details.sess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
details.sess summary::-webkit-details-marker{display:none}
details.sess .body{padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{padding:18px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center}
.banner{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));padding-left:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));padding-right:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px))}
nav.tabs button{border:0;border-radius:0;background:transparent;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 1px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.sel{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent);text-shadow:0 0 8px rgba(53,230,189,.5)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));background:var(--accent);color:var(--accent-ink);font-family:var(--mono);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.swaps{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;background:var(--sunk);min-width:0}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:thin}
.cat{flex:none;min-height:36px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:500}
.cat.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swapopt{text-align:left;font-weight:500;min-height:48px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.swapopt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.checks{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.ck input:checked+span{color:var(--muted);text-decoration:line-through}
details.howto{font-size:15px;border-top:1px solid var(--line);padding-top:8px}
details.howto summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:32px;display:flex;align-items:center}
details.howto ol{margin:6px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.howto .watch{margin:0 0 8px;font-size:14px;color:var(--muted)}
details.howto a{color:var(--accent);font-weight:600}
details.howto.inlog{border:1px solid var(--accent);border-radius:10px;padding:0 12px;background:var(--accent-soft)}
details.howto.inlog summary{min-height:44px}
details.howto.inlog summary::before{content:"▸";margin-right:8px}
details.howto.inlog[open] summary::before{content:"▾"}
details.howto.inlog[open]{padding-bottom:12px}
.plan-list li.pl{display:block}
.plan-list .pl-top{display:flex;justify-content:space-between;gap:12px}
.plan-list details.howto{border-top:0;padding-top:4px}

/* Food actions, review sheet, finder */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;line-height:1.15;min-height:72px;padding:8px 6px;text-align:center}
.act svg{width:24px;height:24px}
.act.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.fitem{all:unset;cursor:pointer;display:flex;flex-direction:column;min-width:0;border-radius:6px}
.fitem:focus-visible{outline:3px solid var(--accent)}
.fitem .fn{overflow-wrap:anywhere}
.foods .mac{text-align:right}
#sheet{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(6,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px;padding:16px max(16px,max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px))) calc(18px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))) max(16px,max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)))}
.sheet .photo{width:100%;max-height:200px;object-fit:cover;border-radius:6px}
.sheet .mg{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.sheet .mg{grid-template-columns:1fr 1fr}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pick{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.pick button.primary{min-height:38px;padding:6px 14px;flex:none}
.rest{border-top:2px solid var(--line);padding-top:10px}
.rest .pick{padding-left:10px;border-top:0;border-left:3px solid var(--accent-soft);margin-top:6px}
ul.safe{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
.toggle{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* Status dashboard */
.hud{position:relative;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.hud::before,.hud::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--accent);border-style:solid;opacity:.8}
.hud::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.hud::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border:1px solid currentColor;border-radius:4px;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.tag.good,.v.good{color:var(--good)} .tag.warn,.v.warn{color:var(--warn)} .tag.bad,.v.bad{color:var(--bad)}
.readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ro{background:var(--sunk);padding:9px 8px;min-width:0}
.readouts .ro:last-child:nth-child(odd){grid-column:1/-1}
.ro .k{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ro .v{font-family:var(--mono);font-size:clamp(15px,4.6vw,22px);font-weight:600;line-height:1.2;white-space:nowrap}
.ro .v.ket{color:var(--ketone);font-size:clamp(12px,3.6vw,17px)}
.ro .u{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:22px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .ax.sm{font-size:9px}
.chart .ax.hi{fill:var(--accent)}
.chart .goal{stroke:var(--good);stroke-width:1;stroke-dasharray:4 4}
.chart .goaltx{fill:var(--good)}
.chart .now{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(53,230,189,.6))}
.chart .ln.proj{stroke-dasharray:6 5;opacity:.75;filter:none}
.chart .wdot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.chart .end{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.chart .def{fill:var(--accent)} .chart .sur{fill:var(--carb)}
.chart .nod{fill:var(--line)}
.kb.k0,.sw.k0{fill:#6e6a55;background:#6e6a55} .kb.k1,.sw.k1{fill:#e6a7c4;background:#e6a7c4} .kb.k2,.sw.k2{fill:#d277aa;background:#d277aa}
.kb.k3,.sw.k3{fill:#b4448a;background:#b4448a} .kb.k4,.sw.k4{fill:#8a2b86;background:#8a2b86} .kb.k5,.sw.k5{fill:#5e1f74;background:#5e1f74}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-family:var(--mono);color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none}
.sw.def{background:var(--accent)} .sw.sur{background:var(--carb)} .sw.ln{height:2px;background:var(--accent)} .sw.lnp{height:0;border-top:2px dashed var(--accent)} .sw.wd{border-radius:50%;border:2px solid var(--ink)}
.kq{display:inline-flex;align-items:center;gap:6px}

<style>
/* Layout: one narrow reading column, like a lectionary page. Today's card first, then a year grid of 365 days. */
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;

}
:root[data-theme="dark"] {

}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 28px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 28px; margin: 0; letter-spacing: .01em; }
.brand span { color: var(--rubric); }
.streak { font-size: 13px; color: var(--muted); }

.day-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px 22px; display: grid; gap: 18px; }

:focus-visible { outline: 2px solid var(--rubric); outline-offset: 2px; }

.readings { list-style: none; margin: 0; padding: 0; display: grid; }

.reading input:checked + label .passage { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }

.day-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--muted); }
.status.complete { color: var(--done); font-weight: 600; }
.text-btn { background: none; border: 0; padding: 4px 0; color: var(--rubric); font-weight: 600; font-size: 14px; }
.text-btn:hover { text-decoration: underline; }

.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
h2 { font-family: var(--f-display); font-size: 22px; font-weight: 600; margin: 0; }
.count { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.legend span { display: inline-flex; align-items: center; gap: 6px; }

.settings label { display: grid; gap: 6px; color: var(--ink); font-weight: 500; }
.settings input[type=date] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 220px; }

p.note { margin: 0; max-width: 65ch; }
.plan-name { font-size: 13px; color: var(--muted); margin: 2px 0 0; }

.cell.restday { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

.moments { display: grid; gap: 14px; }

.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 14px; }

.why { font-size: 14px; color: var(--muted); }

.plans { display: grid; gap: 8px; }

.plan-opt b { display: block; color: var(--ink); font-weight: 600; }
.plan-opt span { font-weight: 400; color: var(--muted); font-size: 13px; }
.settings .field-label { color: var(--ink); font-weight: 500; }
.times { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.times li { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); align-items: baseline; }
.times li:first-child { border-top: 0; }

.times .what { display: grid; gap: 1px; min-width: 0; }

.search { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.cat-chip { font-size: 13px; padding: 4px 11px; border: 0; background: transparent; color: var(--muted); border-radius: 999px; }
.cat-chip[aria-pressed="true"] { background: var(--cell); color: var(--ink); font-weight: 600; }

function flatten(bks, key) {
  const out = [];
  for (const [b, n] of bks) for (let c = 1; c <= n; c++) out.push({ b, c, key });
  return out;
}
function describe(chs) {
  const groups = [];
  for (const x of chs) {
    const g = groups[groups.length - 1];
    if (g && g.b === x.b && x.c === g.to + 1) g.to = x.c; else groups.push({ b: x.b, from: x.c, to: x.c });
  }
  return groups.map(g => {
    const name = g.b === "Psalm" && g.from !== g.to ? "Psalms" : g.b;
    return g.from === g.to ? `${name} ${g.from}` : `${name} ${g.from}–${g.to}`;
  }).join("; ");
}
// Weave two lists together in proportion, so both run start to finish together
function weave(a, b) {
  const out = []; let i = 0, j = 0;
  while (i < a.length || j < b.length) {
    if (j >= b.length || (i < a.length && (i + .5) / a.length <= (j + .5) / b.length)) out.push(a[i++]);
    else out.push(b[j++]);
  }
  return out;
}

function load() {
  try { const B = parent && parent.BIBLE_BRIDGE; if (B) { const s = B.get(); if (s && typeof s === "object") return JSON.parse(JSON.stringify(s)); } } catch (e) {}

}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} try { parent.BIBLE_BRIDGE && parent.BIBLE_BRIDGE.set(JSON.parse(JSON.stringify(state))); } catch (e) {} }

// Rotation: the same picks all day, new ones tomorrow. Each topic starts at a different offset.
const dayNumber = () => { const d = today0(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); };
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
function picksFor(topic, count = 3, day = dayNumber()) {
  const n = topic.v.length, start = (day * count + hash(topic.key)) % n, out = [];
  for (let i = 0; i < Math.min(count, n); i++) out.push(topic.v[(start + i) % n]);
  return out;
}
const TOPIC = Object.fromEntries(TOPICS.map(t => [t.key, t]));

// ---------- Build the current plan's days ----------
let schedule; // array of 365 entries: null for a catch-up day, else list of chapters
function build() {
  const p = PLANS[state.plan], start = fromIso(state.start);
  const readingDays = [];
  for (let d = 0; d < DAYS; d++) {
    const dt = new Date(start); dt.setDate(dt.getDate() + d);
    if (p.restWeekday === undefined || dt.getDay() !== p.restWeekday) readingDays.push(d);
  }
  schedule = Array.from({ length: DAYS }, (_, d) => readingDays.includes(d) ? [] : null);
  const R = readingDays.length;
  for (const all of p.streams()) {
    const n = all.length;
    readingDays.forEach((d, i) => schedule[d].push(...all.slice(Math.floor(i * n / R), Math.floor((i + 1) * n / R))));
  }
}
function readingsFor(day) { // day: 1..365; [] on a catch-up day
  const chs = schedule[day - 1], p = PLANS[state.plan];
  if (!chs) return [];
  return Object.keys(p.labels).map(key => {
    const mine = chs.filter(x => x.key === key);
    return mine.length ? { key, track: p.labels[key], passage: describe(mine) } : null;
  }).filter(Boolean);
}
const done = () => state.progress[state.plan];

// ---------- Day math ----------
function todayDay() {
  const diff = Math.round((today0() - fromIso(state.start)) / 86400000);
  return Math.min(DAYS, Math.max(1, diff + 1));
}
function dateOf(day) { const d = fromIso(state.start); d.setDate(d.getDate() + day - 1); return d; }
function dayStatus(day) {
  const rs = readingsFor(day);
  if (!rs.length) return "rest";
  const got = done()[day] || [];
  const n = rs.filter(r => got.includes(r.key)).length;
  return n === 0 ? "none" : n === rs.length ? "done" : "partial";
}

// ---------- Render ----------
let view;
const $ = id => document.getElementById(id);
const fmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderDay() {
  const t = todayDay();
  $("dayLabel").textContent = `Day ${view} of ${DAYS}` + (view === t ? " · Today" : "");
  $("dateLabel").textContent = fmt.format(dateOf(view));
  $("planName").textContent = `${PLANS[state.plan].name} plan`;
  $("prev").disabled = view <= 1;
  $("next").disabled = view >= DAYS;
  $("toToday").hidden = view === t;
  $("makeToday").hidden = view === t;
  $("makeToday").textContent = `Make Day ${view} today`;
  const got = done()[view] || [], ul = $("readings"), rs = readingsFor(view);
  ul.innerHTML = "";
  if (!rs.length) {
    ul.innerHTML = `<li><p class="rest">Catch-up day. Finish any readings you missed this week, or reread a passage that stayed with you.</p></li>`;
  }
  rs.forEach(r => {
    const li = document.createElement("li"); li.className = "reading";
    const id = `chk-${r.key}`;
    li.innerHTML = `<input type="checkbox" id="${id}"><label for="${id}"><span class="track">${r.track}</span><span class="passage">${r.passage}</span></label>`;
    const box = li.querySelector("input");
    box.checked = got.includes(r.key);
    box.addEventListener("change", () => toggle(r.key, box.checked));
    ul.appendChild(li);
  });
  const s = dayStatus(view), el = $("status");
  el.className = "status" + (s === "done" ? " complete" : "");
  el.textContent = s === "done" ? "Finished. Well done." : s === "rest" ? "" : rs.length > 1 ? "Tick each reading when you finish it." : "Tick it off when you finish.";
}
function renderYear() {
  const t = todayDay(), grid = $("grid"); grid.innerHTML = "";
  let finished = 0, total = 0, anyRest = false;
  for (let d = 1; d <= DAYS; d++) {
    const s = dayStatus(d);
    if (s === "rest") anyRest = true; else total++;
    if (s === "done") finished++;
    const b = document.createElement("button");
    const cls = { rest: " restday", partial: " partial", done: " done", none: "" }[s];
    b.className = "cell" + cls + (d === t ? " today" : "") + (d === view ? " sel" : "");

  $("count").textContent = `${finished} / ${total} days`;
  $("bar").style.width = (finished / total * 100) + "%";
  // streak: consecutive finished days ending today (or yesterday), skipping catch-up days
  let k = dayStatus(t) === "done" || dayStatus(t) === "rest" ? t : t - 1, streak = 0;
  while (k >= 1 && ["done", "rest"].includes(dayStatus(k))) { if (dayStatus(k) === "done") streak++; k--; }
  $("streak").textContent = streak ? `${streak}-day streak` : "";
}
const TIMES = [["morning", "Morning"], ["midday", "Midday"], ["evening", "Evening"], ["bedtime", "Bedtime"]];
let finderCat = "all", finderQuery = "";
function verseItems(list) {

}
function openTopic(key, scroll) {
  state.moment = key; save(); renderMoments();
  if (scroll) $("momentCard").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
}
function renderTimes() {
  $("times").innerHTML = TIMES.map(([k, label]) => {
    const [ref, why] = picksFor(TOPIC[k], 3)[0];
    return `<li><span class="when">${label}</span><span class="what"><span class="ref">${esc(ref)}</span><span class="why">${esc(why)}</span><button data-topic="${k}">More for ${label.toLowerCase()}</button></span></li>`;
  }).join("");
  $("times").querySelectorAll("button").forEach(b => b.onclick = () => openTopic(b.dataset.topic, true));
}
function matches(t) {
  if (finderCat !== "all" && t.cat !== finderCat) return false;
  const q = finderQuery.trim().toLowerCase();
  if (!q) return true;
  return [t.name, t.ask, ...t.v.flat()].join(" ").toLowerCase().includes(q);
}
function renderMoments() {
  const cats = $("catChips");
  cats.innerHTML = "";
  [{ key: "all", name: "All" }, ...CATS].forEach(c => {
    const b = document.createElement("button");

    cats.appendChild(b);

  const chips = $("chips"); chips.innerHTML = "";
  const shown = TOPICS.filter(matches);
  shown.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t.name;
    b.setAttribute("aria-pressed", String(t.key === state.moment));
    b.onclick = () => openTopic(t.key);

  });
  $("noMatch").hidden = shown.length > 0;
  const t = TOPIC[state.moment] || TOPIC.bedtime;
  $("momentCard").innerHTML =
    `<div><p class="sub">${esc(CATS.find(c => c.key === t.cat).name)}</p><h3>${esc(t.name)}</h3></div>` +
    `<div><p class="sub">Today's picks</p><ul class="verses">${verseItems(picksFor(t, 3))}</ul></div>` +
    `<div class="reflect"><div><p class="sub">Think about</p><p class="q">${esc(t.ask)}</p></div><div><p class="sub">Try this</p><p>${esc(t.how)}</p></div></div>` +
    `<details class="all"><summary>All ${t.v.length} passages on this topic</summary><ul class="verses">${verseItems(t.v)}</ul></details>`;
}
function renderQuick() {
  $("quickList").innerHTML = TOPICS.filter(t => t.cat !== "time").map(t =>
    `<tr><td><button data-topic="${t.key}">${esc(t.name)}</button></td><td>${esc(t.v[0][0])}</td></tr>`).join("");
  $("quickList").querySelectorAll("button").forEach(b => b.onclick = () => openTopic(b.dataset.topic, true));
}
$("finderSearch").addEventListener("input", e => { finderQuery = e.target.value; renderMoments(); });
function renderPlans() {
  $("plans").innerHTML = Object.entries(PLANS).map(([k, p]) =>
    `<label class="plan-opt"><input type="radio" name="plan" id="plan-${k}" value="${k}" ${k === state.plan ? "checked" : ""}><div><b>${p.name}</b><span>${p.blurb}</span></div></label>`).join("");
  $("plans").querySelectorAll("input").forEach(r => r.addEventListener("change", () => {
    state.plan = r.value; save(); build(); view = todayDay(); render();
  }));
}
function render() { renderDay(); renderYear(); }
function toggle(key, on) {
  const list = new Set(done()[view] || []);
  on ? list.add(key) : list.delete(key);
  if (list.size) done()[view] = [...list]; else delete done()[view];
  save(); render();
}

// ---------- Controls ----------
$("prev").onclick = () => { if (view > 1) { view--; render(); } };
$("next").onclick = () => { if (view < DAYS) { view++; render(); } };
$("toToday").onclick = () => { view = todayDay(); render(); };
$("makeToday").onclick = () => { const d = today0(); d.setDate(d.getDate() - (view - 1)); state.start = iso(d); $("startDate").value = state.start; save(); build(); view = todayDay(); render(); };
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === "ArrowLeft") $("prev").click();
  if (e.key === "ArrowRight") $("next").click();
});
$("startDate").value = state.start;
$("startDate").addEventListener("change", e => {
  if (!e.target.value) return;
  state.start = e.target.value; save(); build(); view = todayDay(); render();
});
let armed = false;
$("reset").onclick = () => {
  if (!armed) { armed = true; $("reset").classList.add("armed"); $("reset").textContent = "Yes, clear this plan"; $("resetHint").textContent = "This cannot be undone."; return; }

  $("reset").classList.remove("armed"); $("reset").textContent = "Clear progress for this plan"; $("resetHint").textContent = "Progress cleared.";
  render();
};
if (!TOPIC[state.moment]) state.moment = "bedtime";
build(); view = todayDay(); renderPlans(); renderTimes(); renderMoments(); renderQuick(); render();
<\/script>

function howtoHtml(name,open,k){
  const h=HOWTO[name]; if(!h) return "";
  const url="https://www.youtube.com/results?search_query="+encodeURIComponent(h.q);
  return `<details class="howto${k!=null?" inlog":""}"${open?" open":""}${k!=null?` data-how="${k}"`:""}><summary>How to do it</summary><ol>${h.c.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${h.w?`<p class="watch"><b>Watch for:</b> ${esc(h.w)}</p>`:""}<a href="${url}" target="_blank" rel="noopener">Watch a demo video ↗</a></details>`;
}

function warmupFor(wid,firstLift){
  const lower=wid[0]==="L";
  return lower?["Brisk walk or bike, 5 min","Leg swings, 10 each leg (front-back and side to side)","Bodyweight squats, 10","Hip hinges, 10 (hands on hips, push hips back)","Glute bridges, 10","Ramp-up sets of "+firstLift+": 2-3 lighter sets"]
    :["Brisk walk or bike, 5 min","Arm circles, 10 forward and 10 back","Band pull-aparts or arm swings, 15","Wall or incline push-ups, 10","Bodyweight squats, 10","Hip hinges, 10 (hands on hips, push hips back)","Ramp-up sets of "+firstLift+": 2-3 lighter sets"];
}
const CARDIO_TYPES=["Incline treadmill walk","Treadmill walk","Bike","Elliptical","Rower","Outdoor walk","Stair climber","Intervals (bike or rower)"];
const SAUNA_TYPES=["Dry","Steam","Infrared"];
function activities(){ return Object.entries(view()).filter(([k,v])=>v&&v.kind==="activity").map(([k,v])=>({...v,id:k})).sort((a,b)=>(b.date+b.ts).localeCompare(a.date+a.ts)); }
function cardioForm(pre,c){ c=c||{}; return `<div class="grid2"><label class="f">Type<select id="${pre}-type">${CARDIO_TYPES.map(t=>`<option ${t===(c.type||CARDIO_TYPES[0])?"selected":""}>${t}</option>`).join("")}</select></label>
  <label class="f">Minutes<input id="${pre}-min" inputmode="numeric" value="${esc(c.min??"")}" placeholder="25-40"></label>
  <label class="f">Distance (${distUnit(c.type||CARDIO_TYPES[0])})<input id="${pre}-dist" inputmode="decimal" value="${esc(c.dist??"")}" placeholder="${distUnit(c.type||CARDIO_TYPES[0])==="m"?"e.g. 5000":"e.g. 1.5"}"></label>
  ${isTread(c.type||CARDIO_TYPES[0])?`<label class="f">Incline (%)<input id="${pre}-inc" inputmode="decimal" value="${esc(c.inc??"")}" placeholder="e.g. 8"></label>
  <label class="f">Speed (mph)<input id="${pre}-spd" inputmode="decimal" value="${esc(c.spd??"")}" placeholder="e.g. 3.0"></label>`:""}</div>`; }
const isTread=t=>/treadmill/i.test(t||"");
const distUnit=t=>/rower/i.test(t||"")?"m":"mi";
const fmtTread=c=>[c.distance!=null?c.distance+" "+(c.distUnit||"mi"):"",c.incline!=null?c.incline+"% incline":"",c.speed!=null?c.speed+" mph":""].filter(Boolean).join(", ");
function saunaForm(pre,c){ c=c||{}; const cur=c.type||"Dry"; return `<div class="toggle" role="group" aria-label="Sauna type">${SAUNA_TYPES.map(t=>`<button data-stype="${pre}|${t}" class="${t===cur?"sel":""}" aria-pressed="${t===cur}">${t}</button>`).join("")}</div>
  <label class="f">Minutes<input id="${pre}-min" inputmode="numeric" value="${esc(c.min??"")}" placeholder="10-20"></label>
  <div class="small muted">Keto and tirzepatide both dry you out faster. Drink 16-24 oz with some salt or electrolytes afterward, and start around 10-15 minutes. Get out if you feel dizzy.</div>`; }
const fmtAct=a=>a.act==="sauna"?`${a.type} sauna · ${a.minutes} min`:`${a.type} · ${a.minutes} min${fmtTread(a)?" · "+fmtTread(a):""}`;

function stepSyncOnly(manual){

  if(stepBusy) return stepBusy;
  // Health Connect limits how often an app may read, so routine syncs are spaced
  // out and only look at the last 2 days; a manual sync or the first one reads 14.
  const last=(stepInfo&&stepInfo.at)||0;
  if(!manual&&Date.now()-last<4*60000) return Promise.resolve(0);
  const back=manual||!stepInfo||!stepInfo.full||Date.now()-stepInfo.full>12*3600e3?13:1;

    const end=new Date(), start=new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate()-back);
    // Samsung Health's own records add up to the number it shows. Health Connect's
    // de-duplicated total can prefer the phone's step counter and drop watch steps.
    const rec=await H.queryRecords({startDate:start.toISOString(),endDate:end.toISOString(),dataType:"steps"});
    const recs=(rec&&rec.records)||[];
    const perDay={}, by={}, t=today();
    const isSH=x=>x.sourceBundleId===SHEALTH;
    for(const x of recs){
      const d=ymd(new Date(x.startDate)), v=+x.value||0;
      if(isSH(x)) perDay[d]=(perDay[d]||0)+v;
      if(d===t){ const k=isSH(x)?"Samsung Health":(x.sourceName||x.sourceBundleId||"Other"); by[k]=(by[k]||0)+v; }
    }
    let src="Samsung Health", days=perDay;
    if(!Object.keys(perDay).length){
      src="all apps"; days={};
      const r=await H.queryAggregated({startDate:start.toISOString(),endDate:end.toISOString(),dataType:"steps",bucket:"day"});
      for(const v of (r&&r.aggregatedData)||[]){ const raw=String(v.startDate||""); if(/^\d{4}-\d\d-\d\d/.test(raw)) days[raw.slice(0,10)]=+v.value||0; }
    }
    let n=0;
    for(const [date,val] of Object.entries(days)){
      const st=Math.round(val);
      if(st>0&&date<=t&&(+day(date).steps||0)!==st){ saveSteps(date,st); n++; }
    }
    stepInfo={src,by,at:Date.now(),full:back>1?Date.now():(stepInfo&&stepInfo.full)||0,err:""}; lsSet("lk-steps-info",stepInfo);

}

/* ---------- Program logic ---------- */
function weekNo(date){ const s=settings(); const d=(parseYmd(date)-parseYmd(s.startDate))/864e5; return Math.max(1,Math.floor(d/7)+1); }
function phase(week){
  if(week<=2) return {name:"On-ramp",note:"2 sets per exercise, leave 3-4 reps in the tank",sets:()=>2};
  if(week<=8) return {name:"Build 1",note:"Full sets, leave 1-3 reps in the tank",sets:s=>s};
  if(week===9) return {name:"Deload",note:"Half the sets, same weights, leave 4 reps",sets:s=>Math.ceil(s/2)};
  const w=(week-10)%7; // Build 2 (6 weeks) then deload, repeating
  if(w===6) return {name:"Deload",note:"Half the sets, same weights, leave 4 reps",sets:s=>Math.ceil(s/2)};
  return {name:"Build 2",note:"Full sets. Swap 1-2 lifts for a close variant if you like",sets:s=>s};
}
function nextWorkoutId(){
  const ss=sessions(); if(!ss.length) return settings().firstWorkout||"L1";
  const i=WORKOUTS.findIndex(w=>w.id===ss[0].workout); return WORKOUTS[(i+1)%4].id;
}
function ch(x){ return x.alt!==undefined? x.alt : (x.hotel?"h":null); }
// choice: null = plan, "h" = hotel swap, "x:<name>" = any library movement
function exVariant(w,i,c){ const e=WMAP[w].ex[i]; const base={...e}; delete base.h;
  if((c==="h"||c===true)&&e.h) return {...base,...e.h,key:w+"-"+i+"-h",kind:"hotel"};
  if(typeof c==="string"&&c.startsWith("x:")&&LIB[c.slice(2)]){ const L=LIB[c.slice(2)]; return {n:L.n,s:base.s,r:L.r,inc:L.inc,bw:L.bw,sec:L.sec,each:L.each,rest:base.rest,key:"lib:"+L.n,kind:"swap"}; }
  return {...base,key:w+"-"+i,kind:"plan"}; }
function savedSwap(w,i){ const v=(settings().swaps||{})[w+"-"+i]; return typeof v==="string"&&v.startsWith("x:")&&LIB[v.slice(2)]?v:null; }
function targetReps(v){ const rg=range(v.r); return rg?String(rg.hi):""; }
function lastFor(key,beforeId){
  for(const s of sessions()){ if(s.id===beforeId) continue; const e=(s.exercises||[]).find(x=>x.key===key); if(e&&e.sets&&e.sets.length) return {date:s.date,sets:e.sets,note:e.note||""}; }
  return null;
}
function hintFor(v,last,targetSets){
  const rg=range(v.r); if(!last) return {t: v.sec?"First time: hold for "+(rg?rg.lo:30)+" seconds with good form.": v.bw?"First time: stop 2-3 reps short of failure.":"First time: pick a weight you could do for "+(rg?rg.hi+2:"a few more")+" reps.",up:false};
  if(!rg) return {t:"Beat last time's reps.",up:false};
  const work=last.sets.filter(s=>numv(s.r)!=null);
  const allTop = work.length>=Math.min(targetSets,last.sets.length) && work.length>0 && work.every(s=>numv(s.r)>=rg.hi);
  const topW = work.length? Math.max(...work.map(s=>numv(s.w)||0)) : 0;
  if(allTop && !v.bw && !v.sec) return {t:"You hit "+rg.hi+" on every set. Go to "+(topW+(v.inc||5))+" lb and work back up from "+rg.lo+".",up:true,w:topW+(v.inc||5)};
  if(allTop && v.sec) return {t:"Held the top time on every set. Add a few seconds or make it harder.",up:true};
  if(allTop && v.bw) return {t:"Top of the range on every set. Add reps, a pause, or load.",up:true};
  return {t:"Same weight. Aim to beat "+work.map(s=>s.r).join(", ")+".",up:false,w:topW||null};
}
function fmtSets(sets,v){ return sets.map(s=>{const w=numv(s.w);return (w?w+"×":"")+(s.r??"")+(v&&v.sec?"s":"")}).join(", "); }

function bar(label,val,target,color,note,isLimit,minMark){

async function shrink(file,max){
  let src,w,h;
  try{ src=await createImageBitmap(file); w=src.width; h=src.height; }
  catch(e){ src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);}); w=src.naturalWidth; h=src.naturalHeight; }
  const k=Math.min(1,max/Math.max(w,h)); const c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  return {blob,url:URL.createObjectURL(blob)};
}

const YELP="Yelp", YELP_TOOL="yelp_search_local_businesses";
async function yelpNearby(loc){
  try{
    const mcp=window.claude&&claude.use?await claude.use("mcp"):null; if(!mcp) return null;
    let props={}; try{ const dsc=await mcp.describeTool(YELP,YELP_TOOL); props=(dsc&&dsc.inputSchema&&dsc.inputSchema.properties)||{}; }catch(e){}
    const input={}; const key=["query","q","term","search","prompt","text"].find(k=>k in props)||"query";
    input[key]=`Restaurants with low-carb or keto-friendly options near ${loc}`; if("location" in props) input.location=loc;
    const res=await mcp.callTool(YELP,YELP_TOOL,input);
    const raw=res&&res.payload!=null?res.payload:((res&&res.content)||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
    const txt=typeof raw==="string"?raw:JSON.stringify(raw);
    return txt&&txt.length>20?txt.slice(0,14000):null;
  }catch(e){ return null; }
}

const KLEVELS=[{k:"negative",l:"Negative",mmol:0},{k:"trace",l:"Trace",mmol:0.5},{k:"small",l:"Small",mmol:1.5},{k:"moderate",l:"Moderate",mmol:4},{k:"large",l:"Large",mmol:8},{k:"very large",l:"Very large",mmol:16}];
const KIDX=Object.fromEntries(KLEVELS.map((x,i)=>[x.k,i]));
function ketones(){ return Object.entries(view()).filter(([k,v])=>v&&v.kind==="ketone").map(([k,v])=>({...v,id:k})).sort((a,b)=>String(a.ts).localeCompare(String(b.ts))); }
function ketoneOn(date){ const ks=ketones().filter(k=>k.date===date); if(!ks.length) return null; return ks.reduce((m,k)=>(KIDX[k.level]??0)>(KIDX[m.level]??0)?k:m); }
function bodyInfo(){ const s=settings(); return {h:+s.heightIn||70,age:+s.age||40,guess:!(+s.heightIn&&+s.age)}; }
function bmr(lb){ const b=bodyInfo(); return 10*(lb/2.2046)+6.25*(b.h*2.54)-5*b.age+5; }
// MET-based exercise burn: kcal/min = MET * 3.5 * kg / 200
// Walking burn from watch steps: about 0.5 kcal per kg per km walked; stride ≈ 0.415 × height
function stepKcal(steps,lb){ const b=bodyInfo(); const km=steps*b.h*2.54*0.415/100000; return 0.5*(lb/2.2046)*km; }
function baseBurn(date,lb){ const st=+day(date).steps||0; return st? {kcal:bmr(lb)*1.2+stepKcal(st,lb),steps:st} : {kcal:bmr(lb)*1.3,steps:0}; }
const isWalk=t=>/walk|treadmill/i.test(t||"");
function exBurn(date,lb){
  const kg=lb/2.2046, rate=m=>m*3.5*kg/200; let k=0; const items=[];
  const hasSteps=(+day(date).steps||0)>0; // the watch already counts walking steps, so only add the extra effort of a walk
  const cw=(type,min)=>{ const met=/incline|stair|interval|row/i.test(type)?6:4.5; return rate(hasSteps&&isWalk(type)?Math.max(1,met-3.5):met)*min; };
  sessions().filter(x=>x.date===date).forEach(x=>{ const m=+x.minutes||55; k+=rate(3.5)*m; items.push((WMAP[x.workout]?WMAP[x.workout].name:"Lift")+" "+m+"m"); if(x.cardio){ k+=cw(x.cardio.type,+x.cardio.minutes||0); items.push(x.cardio.type+" "+x.cardio.minutes+"m"); } });
  activities().filter(a=>a.date===date&&a.act==="cardio").forEach(a=>{ k+=cw(a.type,+a.minutes||0); items.push(a.type+" "+a.minutes+"m"); });
  return {kcal:k,items,lift:sessions().some(x=>x.date===date),cardio:sessions().some(x=>x.date===date&&x.cardio)||activities().some(a=>a.date===date&&a.act==="cardio")};
}
const mondayOf=d=>{ const x=parseYmd(d); const wd=(x.getDay()+6)%7; return addDays(d,-wd); };
// Day-by-day model from the program start: intake, burn, balance, estimated weight
function model(){
  const s=settings(); const t=today(); const start=s.startDate<=t?s.startDate:t;
  const weighed=allDays().filter(d=>d.weight).map(d=>({date:d.date,w:+d.weight})).sort((a,b)=>a.date.localeCompare(b.date));
  const rows=[]; let est=+s.startWeight;
  for(let d=start; d<=t; d=addDays(d,1)){
    const dd=day(d); const tt=totals(dd); const logged=(dd.foods||[]).length>0;
    const wIn=weighed.find(x=>x.date===d); if(wIn) est=wIn.w; // a weigh-in resets the estimate
    const bb=baseBurn(d,est); const base=bb.kcal; const ex=exBurn(d,est); const burn=base+ex.kcal;
    const bal=logged? tt.kcal-burn : null;
    rows.push({date:d,logged,t:tt,base,steps:bb.steps,ex,burn,bal,est,weighed:wIn?wIn.w:null,ket:ketoneOn(d)});
    if(bal!=null&&d<t) est=est+bal/3500; // today isn't finished yet
  }
  const last7=rows.filter(r=>r.logged&&r.date<t).slice(-7);
  const avgBal=last7.length? last7.reduce((a,r)=>a+r.bal,0)/last7.length : null;
  const cur=rows.length?rows[rows.length-1].est:+s.startWeight;
  return {rows,weighed,avgBal,cur,lbWk:avgBal!=null?-avgBal*7/3500:null};
}
const dash={kView:"day", plan:lsGet("lk-plan",null), planLoading:false, planErr:"", planOpen:false};

function weekSummary(m){
  const s=settings(); const mon=mondayOf(today()); const days=[]; for(let i=0;i<7;i++) days.push(addDays(mon,i));
  const rows=days.map(d=>m.rows.find(r=>r.date===d)||{date:d,future:d>today()});
  const lifts=sessions().filter(x=>x.date>=mon).length;
  const cardio=sessions().filter(x=>x.date>=mon&&x.cardio).length+activities().filter(a=>a.date>=mon&&a.act==="cardio").length;
  const logged=rows.filter(r=>r.logged);
  const pAvg=logged.length?logged.reduce((a,r)=>a+r.t.p,0)/logged.length:null;
  const under=logged.filter(r=>r.t.c<=s.carbs).length;
  const balSum=logged.filter(r=>r.date<today()).reduce((a,r)=>a+r.bal,0);
  const sd=rows.filter(r=>r.steps>0); const stepDays=sd.length, stepAvg=stepDays?sd.reduce((a,r)=>a+r.steps,0)/stepDays:0;
  return {mon,days,rows,lifts,cardio,pAvg,under,logged,balSum,stepDays,stepAvg};
}
function weekBars(w){

  const mx=Math.max(500,...vals.filter(v=>v!=null).map(Math.abs)); const mid=T+(H-T-B)*0.62; const sc=(H-T-B)*0.6/mx;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorie deficit by day this week">
    <line x1="${L}" x2="${W-R}" y1="${mid}" y2="${mid}" class="axis"/>
    ${w.rows.map((r,i)=>{ const x=L+i*cw+cw/2; const v=vals[i]; const isT=r.date===today();
      const bar=v==null?"":v>=0?`<rect x="${x-bw/2}" y="${mid-v*sc}" width="${bw}" height="${Math.max(2,v*sc)}" rx="3" class="def"/>`:`<rect x="${x-bw/2}" y="${mid}" width="${bw}" height="${Math.max(2,-v*sc)}" rx="3" class="sur"/>`;
      const tip=r.future?`${fmtShort(r.date)}: still ahead`:isT?`Today so far: ${fmtK(r.t?r.t.kcal:0)} kcal eaten, about ${fmtK(r.burn||0)} burned by end of day`:r.logged?`${fmtShort(r.date)}: ate ${fmtK(r.t.kcal)}, burned about ${fmtK(r.burn)}${r.steps?` (${fmtK(r.steps)} steps)`:""}, ${v>=0?"deficit":"surplus"} ${fmtK(Math.abs(v))} kcal`:`${fmtShort(r.date)}: no food logged`;
      return `<g><title>${esc(tip)}</title><rect x="${x-cw/2}" y="0" width="${cw}" height="${H}" fill="transparent"/>${bar}
        ${v!=null?`<text x="${x}" y="${v>=0?mid-v*sc-5:mid+(-v*sc)+12}" class="ax sm" text-anchor="middle">${v>=0?"−":"+"}${fmtK(Math.abs(v))}</text>`:""}
        <text x="${x}" y="${H-22}" class="ax ${isT?"hi":""}" text-anchor="middle">${parseYmd(r.date).toLocaleDateString(undefined,{weekday:"short"}).toUpperCase()}</text>
        <text x="${x}" y="${H-7}" class="ax sm ${r.ex&&(r.ex.lift||r.ex.cardio)?"hi":""}" text-anchor="middle">${(r.ex&&((r.ex.lift?"LIFT":"")+(r.ex.cardio?(r.ex.lift?"+C":"CARDIO"):"")))||"·"}</text></g>`; }).join("")}

function ruleTips(m,w){
  const s=settings(); const tips=[]; const left=w.days.filter(d=>d>=today());
  const liftsLeft=Math.max(0,4-w.lifts), slots=left.length;
  if(liftsLeft>0){ let id=nextWorkoutId(); const names=[]; for(let i=0;i<liftsLeft;i++){ names.push(WMAP[id].name); id=WORKOUTS[(WORKOUTS.findIndex(x=>x.id===id)+1)%4].id; }
    tips.push(liftsLeft>slots?`${liftsLeft} lifts are left but only ${slots} day${slots>1?"s":""} remain. Get in ${names.slice(0,slots).join(" and ")} and don't stack two days of heavy lower body.`:`${liftsLeft} lift${liftsLeft>1?"s":""} left this week: ${names.join(", then ")}. Spread them out with a rest day between lower days.`); }
  else tips.push("All 4 lifts are done this week. Use the remaining days for walking and recovery.");
  if(w.stepDays&&w.stepAvg<7000) tips.push(`Steps are averaging ${fmtK(w.stepAvg)} a day. Adding 2,000 more (a 15-20 minute walk after dinner) burns roughly ${fmtK(stepKcal(2000,m.cur))} kcal a day and helps blood sugar.`);
  else if(!w.stepDays) tips.push(WEB?"Steps come from your phone. Open the phone app and turn on Samsung Health steps in Setup so your burn and projection count your walking.":window.NATIVE?"Turn on Samsung Health steps in the Setup tab so your burn and projection count your walking.":"Enter your Samsung Health steps each evening (or snap a screenshot) so your burn and projection count your walking.");
  if(w.cardio<2) tips.push(`${2-w.cardio} more cardio session${2-w.cardio>1?"s":""} to reach 2 this week. A 25 minute incline walk after a lift counts.`);
  if(w.pAvg!=null&&w.pAvg<s.proteinMin) tips.push(`Protein is averaging ${Math.round(w.pAvg)} g, under your ${s.proteinMin} g minimum. Start each day with a protein shake or eggs, and lead every meal with meat.`);
  else if(w.pAvg!=null) tips.push(`Protein is averaging ${Math.round(w.pAvg)} g. Keep it there.`);
  const over=w.logged.filter(r=>r.t.c>s.carbs).length; if(over) tips.push(`${over} day${over>1?"s":""} this week went over ${s.carbs} g net carbs. Expect lighter ketone strips for a day or two after.`);
  if(m.avgBal!=null&&-m.avgBal>1200) tips.push(`Your deficit is large (about ${fmtK(-m.avgBal)} kcal a day). On tirzepatide that's common, but add fat (olive oil, cheese, nuts) on lifting days so strength holds.`);
  const todayK=ketoneOn(today()); if(!todayK) tips.push("No ketone strip logged today. Test in the morning or before dinner, same time each day, so the trend is fair.");
  const waterToday=day(today()).water||0; if(waterToday<s.water/2) tips.push(`Water is at ${waterToday} oz. Aim for ${s.water} oz with electrolytes; it keeps strips readable and energy up.`);
  return tips;
}

async function askClaudeWeb(prompt,maxSearches){
  let key=""; try{ key=(localStorage.getItem("lk-api-key")||"").trim(); }catch(e){}
  if(!key) throw {code:"no_key"};
  const messages=[{role:"user",content:prompt+"\n\nAfter searching, reply with only the JSON object, no other text."}];
  for(let turn=0;turn<6;turn++){
    let r;
    try{ r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-beta":"server-side-fallback-2026-07-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-opus-5-5",max_tokens:32000,fallbacks:"default",output_config:{effort:"medium"},
        tools:[{type:"web_search_20260209",name:"web_search",max_uses:maxSearches,user_location:{type:"approximate",country:"US"}}],messages})}); }
    catch(e){ throw {code:navigator.onLine?"error":"offline"}; }
    const j=await r.json().catch(()=>null);
    if(!r.ok){ const msg=String(j&&j.error&&j.error.message||"").toLowerCase();
      throw {code:r.status===401||r.status===403?"bad_key":r.status===429||r.status===529?"rate_limited":msg.includes("credit")?"no_credit":"error"}; }
    if(j.stop_reason==="pause_turn"){ messages.push({role:"assistant",content:j.content}); continue; }
    if(j.stop_reason==="refusal") throw {code:"error"};
    const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    const a=text.indexOf("{"), b=text.lastIndexOf("}");
    try{ return JSON.parse(text.slice(a,b+1)); }catch(e){ throw {code:"invalid_json"}; }
  }
  throw {code:"error"};
}

  const others=(d.meals||[]).filter((_,k)=>k!==j).map(x=>`${x.meal}: ${x.place} - ${x.dish}`).join("; ");
  const prompt=`${ctxText()}
Trip details:
${mealContext(c)}
Day: ${d.day} (${d.where||""}). Find a different ${ml.meal||"meal"} ${ml.near?`near the ${ml.near}`:""} for him.
He passed on: ${rejected.join("; ")}. Pick a different restaurant (or at least a clearly different dish).
${others?`His other meals that day: ${others}.`:""}
Search the web for a real restaurant that's open now, within about ${c.drive} minutes' drive, check its menu, and choose one specific dish that fits strict keto (protein first, low net carbs). Say exactly how to order it.
Respond with only JSON in this shape: ${MEAL_SHAPE}`;
  try{ const out=await askClaudeWeb(prompt,5); d.meals[j]={...out,rejected}; }
  catch(e){ ml.err=aiError(e); }
  dash.swapping=null; savePlan(p); render();
}
function logMeal(i,j){
  const p=dash.plan; const d=p.days[i]; const ml=d.meals[j];
  const date=/^\d{4}-\d\d-\d\d$/.test(d.date||"")?d.date:today();
  addFoods(date,[plainFood({n:`${ml.dish} (${ml.place})`,p:ml.p,c:ml.c,f:ml.f,kcal:ml.kcal,src:"plan",place:ml.place})]);
  toast(`Logged to ${date===today()?"today":fmtShort(date)}`);
}
async function buildPlan(m,w){
  flushPlanNotes(); dash.planOpen=false;
  const s=settings(); dash.planLoading=true; dash.planErr=""; render();
  const c=planCfg(); const ds=planDates();
  const roomTxt=c.room.length?ROOM.filter(([k])=>c.room.includes(k)).map(([,l])=>l).join(", "):"nothing (no fridge, no microwave)";
  const dayLines=ds.map(d=>`${parseYmd(d).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}${d===today()?" (today)":""}: ${whereLabel(whereOn(d))}`).join("\n");
  const anyHotel=ds.some(d=>whereOn(d)!=="home");
  const awayMeals=anyHotel&&c.eatOut.length>0&&!!(c.hotel||c.site||c.airports);
  const recent=m.rows.filter(r=>r.date>=w.mon).map(r=>`${r.date}: ${r.logged?`${fmtK(r.t.kcal)} kcal, ${Math.round(r.t.p)}P/${r1(r.t.c)}C/${Math.round(r.t.f)}F, burn ~${fmtK(r.burn)}`:"no food logged"}; training: ${r.ex.items.join(", ")||"none"}; ketones: ${r.ket?r.ket.level:"not tested"}`).join("\n");
  const prompt=`${ctxText()}
His program: 4 lifts a week rotating Lower 1, Upper 1, Lower 2, Upper 2, plus 2-3 cardio sessions (incline walks). Week ${weekNo(today())}, phase: ${phase(weekNo(today())).name}. Next lift in rotation: ${WMAP[nextWorkoutId()].name}.
Targets: ${s.proteinMin}-${s.protein} g protein, max ${s.carbs} g net carbs, ~${s.fat} g fat, ${s.water} oz water.
This week so far (lifts done ${w.lifts}/4, cardio ${w.cardio}):
${recent}
He travels for work (flies out to job sites and stays in hotels). Where he'll be each day of this plan:
${dayLines}
${anyHotel?`Hotel room has: ${roomTxt}. Only plan hotel meals he can actually make or store with that (no cooking without a stovetop or oven; nothing needing a freezer unless there is one; keep fridge items to what fits a ${c.room.includes("bigfridge")?"full-size":"mini"} fridge). ${c.room.includes("gym")?"The hotel has a gym, so lifts can use the hotel swaps (dumbbells, cables, machines).":"No hotel gym is listed, so hotel-day training should be bodyweight, a resistance band, or a walk."}`:""}
LUNCH: he usually eats a good-size dinner after work. On work days he doesn't know ahead of time whether the site will provide food, whether the crew will leave for lunch, or whether he'll only have a packed snack. So for EVERY day give two lunch options in "lunch": (1) "out": a lunch to go get or have (a protein-first plate like steak, salmon, grilled chicken, a bunless burger; on hotel or site days, a real restaurant near the site when you can find one), and (2) "snack": a packed snack he can bring${c.snack?` (his usual: ${c.snack}; use it or a similar packable keto snack)`:""}. Plan breakfast and dinner so either choice still hits his protein. Put what the packed snack needs on the shopping list. Do not also list lunch in "meals".
${c.notes?`His notes: ${c.notes}`:""}
${haveText()?haveText()+"\nBuild meals around what he already has, work his supplements into the days where timing matters, and leave things he already has off the shopping list. Add a keto-friendly item to the list only if he's missing it.":""}
Write a short, practical plan for each of these ${ds.length} days, in order: which workout (or rest/cardio), and what to eat (specific foods, protein-first, keto). On flying days, plan around airports and the flight: what to pack in a carry-on and keto-friendly picks at typical airport spots, and keep training light or skip it. On hotel days, use foods that need little or no prep and fit the room.
${awayMeals?`MEALS ON THE ROAD: he spends about an hour hunting for food on trips, so take that off his plate.
${mealContext(c)}
For every Hotel, Flying, or Driving day, plan these meals as specific picks: ${c.eatOut.filter(k=>k!=="lunch").join(", ")||"dinner"} (lunch goes in "lunch", near the job site)${c.room.includes("breakfast")?" (breakfast can be the free hotel breakfast: eggs, sausage or bacon, no bread)":""}. Search the web for real restaurants near the hotel and the job site (for dinner, near the hotel; on flying days, in the airports he's going through). Check menus, choose one specific dish at each, and say exactly how to order it keto. Use different places across the days, no place more than twice. Estimate protein, net carbs, fat, and calories for each.
Home days don't need restaurant picks; give a short "eat" line instead.`:""}
Then write a shopping list that covers these days. Group it by where he should buy it: "Before you leave (from home)" for things to pack, and "Near the hotel" for perishables to buy after arriving, or "Grocery run" if he's home the whole time. Give realistic quantities for the number of days, and leave out kitchen staples he likely has unless he's in a hotel.
Be encouraging but direct.
Respond with only JSON: {"headline": string (one sentence), "days": [{"day": string (e.g. "Thu, Nov 13"), "date": "YYYY-MM-DD", "where": string (Home / Hotel / Flying out / Flying home / Driving), "train": string, "eat": string (short; for home days or anything not covered by meals), "lunch": {"out": {"dish": string, "place": string (restaurant name, or "" for a generic suggestion), "how": string (short, how to order it keto), "p": number, "c": number (net carbs), "f": number, "kcal": number}, "snack": {"dish": string, "p": number, "c": number, "f": number, "kcal": number}}, "meals": [${awayMeals?"MEAL":""}], "note": string}], "shopping": [{"where": string, "items": [{"item": string, "qty": string, "why": string (a few words, optional)}]}]}`;
  try{ const out=awayMeals?await askClaudeWeb(prompt.replace('"meals": [MEAL]','"meals": [one or more of '+MEAL_SHAPE+']'),20):await askClaude(prompt);
    (out.days||[]).forEach((d,i)=>{ if(!/^\d{4}-\d\d-\d\d$/.test(d.date||"")) d.date=ds[i]||today(); });
    savePlan({...out,date:today(),cfg:planKey(),got:{}}); }
  catch(e){ dash.planErr=aiError(e); }
  dash.planLoading=false; render();
}

/* ---------- Bible 365 (embedded reading plan; its state is the synced "bible" doc) ---------- */
let bibleShown=null; // JSON of the state the open frame was built from
window.BIBLE_BRIDGE={
  get(){ const v=view().bible; bibleShown=JSON.stringify(v||null); return v||null; },
  set(st){ const j=JSON.stringify(st); if(j===JSON.stringify(view().bible||null)) return; bibleShown=j; put("bible",{...st,kind:"bible"}); }
};
function bibleTheme(){
  const cs=getComputedStyle(document.documentElement), g=k=>cs.getPropertyValue(k).trim();
  return `<style>:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:${g("--bg")}!important;--surface:${g("--surface")}!important;--ink:${g("--ink")}!important;--muted:${g("--muted")}!important;--line:${g("--line")}!important;--rubric:${g("--gold")}!important;--done:${g("--accent")}!important;--done-soft:${g("--accent-soft")}!important;--cell:${g("--line")}!important;--f-body:${g("--body")}!important;--f-mono:${g("--mono")}!important;color-scheme:${g("color-scheme")||"light"}!important}
html,body{background:transparent!important;overflow:hidden}body{padding:4px 0 8px!important}.wrap{max-width:none!important}
.day-card,.moment-card,.times,details#settingsBox{border-radius:14px!important;box-shadow:var(--shadow-card,0 1px 2px rgba(22,33,58,.04),0 6px 20px rgba(22,33,58,.05))}
.brand{font-size:32px!important}.date,.passage,.brand,h2,h3{font-variant-numeric:lining-nums}</style>`;
}
function renderBible(){
  const el=$("#v-bible"); let fr=$("#bibleFrame",el);
  const cur=JSON.stringify(view().bible||null), theme=document.documentElement.dataset.scheme||"";
  if(fr&&bibleShown===cur&&fr.dataset.scheme===theme){ fr._fit&&setTimeout(fr._fit,0); return; }
  const src=$("#bibleSrc").textContent.replace(/<\\\/script/g,"</scr"+"ipt");
  el.innerHTML='<iframe id="bibleFrame" title="Bible 365 reading plan" style="width:100%;border:0;display:block;min-height:70vh;background:transparent"></iframe>';
  fr=$("#bibleFrame",el); fr.dataset.scheme=theme;
  fr.addEventListener("load",()=>{ const d=fr.contentDocument; if(!d) return;
    const fit=()=>{ const h=d.documentElement.scrollHeight; if(h>0) fr.style.height=h+"px"; }; fr._fit=fit;
    fit(); try{ new ResizeObserver(fit).observe(d.body); }catch(e){} setTimeout(fit,600);
  });
  fr.srcdoc=src.replace(/<\/head>/i,bibleTheme()+"</head>");
}
(()=>{ const mq=matchMedia("(prefers-color-scheme: dark)"); const set=init=>{ document.documentElement.dataset.scheme=mq.matches?"dark":"light"; if(init!==true&&ui.tab==="bible") renderBible(); }; set(true); mq.addEventListener?.("change",set); })();
let deferred=false;
function render(){
  setSync(mode);
  const t=ui.tab||"status";
  // don't wipe what you're typing on Food or Find when a sync arrives; redraw when you leave the field
  const a=document.activeElement, v=$("#v-"+t);
  if((t==="food"||t==="find"||t==="status")&&a&&v&&v.contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!/checkbox|file|date/.test(a.type)))){ deferred=true; return; }
  deferred=false;
  if(t==="status") renderStatus(); else if(t==="train") renderTrain(); else if(t==="food") renderFood(); else if(t==="find") renderFind(); else if(t==="bible") renderBible(); else if(t==="log") renderLog(); else renderMore();
}
document.addEventListener("focusout",()=>{ if(deferred) setTimeout(()=>{ if(deferred&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&$("#v-"+ui.tab).contains(document.activeElement))) render(); },0); });
// keep "today" fresh if the app stays open past midnight

setTab(WEB&&!cloudSess?"more":draft?"train":"status");

setTimeout(()=>stepSync().then(n=>{ if(n) render(); }),2500);
})();
