<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="2">
<title>Nathan's Lift & Keto Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#061114">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone logbook, sticky header, fixed bottom tab bar; cards only for the active workout's exercises. */
/* Look: clinical vital-signs monitor. Deep blue-black glass, phosphor mint traces, mono readouts. Committed dark look in every theme. */
:root{
  --bg:#061114; --surface:#0b1b1f; --sunk:#08161a; --ink:#d9f4ef; --muted:#7c9e9b; --line:#17353a;
  --accent:#35e6bd; --accent-ink:#022019; --accent-soft:#0d3a33;
  --protein:#ff8a7a; --carb:#ffc44d; --fat:#7fb0ff; --water:#4fd2ee; --ketone:#d08cff;
  --good:#4fe08f; --warn:#ffb547; --bad:#ff6363;
  --grid:rgba(53,230,189,.06);
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:64px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)));padding-right:max(16px,max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px)));padding-block:0 calc(var(--tabh) + 32px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)))}
header.top{position:sticky;top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
h1::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);margin-right:10px;vertical-align:2px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
h2{font-size:22px;font-weight:600;letter-spacing:.02em}
h3{font-size:19px;font-weight:600}
.sync{font-size:12px;color:var(--muted);text-align:right}
.sync b{font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--good)} .dot.off{background:var(--warn)}
.eyebrow{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
section.view{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
button,.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
button.danger{color:var(--bad)}
button.armed{background:var(--bad);border-color:var(--bad);color:var(--accent-ink)}
button.big{width:100%;font-size:18px;min-height:52px;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:1fr 1fr 1fr}.grid4 .full{grid-column:1/-1}}

/* Next-up block */
.nextup{background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%);color:var(--ink);border:1px solid var(--accent);box-shadow:0 0 24px rgba(53,230,189,.12) inset;border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:12px}
.nextup .eyebrow{color:var(--accent)}
.nextup h2{font-size:36px;line-height:1;text-transform:uppercase}
.nextup .meta{font-size:14px;opacity:.85}
.nextup button.primary{background:var(--accent);border-color:var(--accent)}
.rotation{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rotation button{min-height:40px;padding:6px 4px;font-size:14px;background:transparent;color:var(--ink);border-color:var(--line)}
.rotation button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.plan-list li:last-child{border-bottom:0}
.plan-list .rx{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap}

/* Session */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex.done{border-color:var(--accent)}
.ex .rx{font-family:var(--display);font-size:17px;font-weight:600;color:var(--accent)}
.last{font-size:14px;color:var(--muted)}
.hint{font-size:14px;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.hint.up{font-weight:600}
.sets{display:flex;flex-direction:column;gap:8px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.setrow .n{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.setrow input{text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.check{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:20px;border-radius:10px}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.unit{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{border:0;border-radius:0;min-height:38px;padding:6px 12px;font-size:14px;background:var(--surface)}
.toggle button.sel{background:var(--accent);color:var(--accent-ink)}
.phase{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}

/* Macros */
.bars{display:flex;flex-direction:column;gap:14px}
.bar .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar .lab b{font-family:var(--display);font-size:20px;font-weight:700}
.bar .track{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:4px;position:relative}
.bar .fill{height:100%;border-radius:6px;transition:width .3s}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.bar .note{font-size:13px;color:var(--muted);margin-top:3px}
.kcal{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.kcal b{color:var(--ink);font-family:var(--display);font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.chip small{font-size:11px;color:var(--muted);font-weight:500}
.foods{list-style:none;margin:0;padding:0}
.foods li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.foods .m{font-size:13px;color:var(--muted)}
.mac{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.mac .p{color:var(--protein)} .mac .c{color:var(--carb)} .mac .fa{color:var(--fat)}
.xbtn{min-height:36px;min-width:36px;padding:0;border:0;background:transparent;color:var(--muted);font-size:20px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{min-width:44px}
.water{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.water b{font-family:var(--display);font-size:22px;color:var(--water)}
.panel{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
td.ok{color:var(--good);font-weight:600} td.lo{color:var(--warn);font-weight:600} td.hi{color:var(--bad);font-weight:600}

/* Log */
details.sess{border-bottom:1px solid var(--line);padding:10px 0}
details.sess summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
details.sess summary::-webkit-details-marker{display:none}
details.sess .body{padding-top:8px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{padding:18px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center}
.banner{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));padding-left:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));padding-right:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px))}
nav.tabs button{border:0;border-radius:0;background:transparent;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 1px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.sel{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent);text-shadow:0 0 8px rgba(53,230,189,.5)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px)));background:var(--accent);color:var(--accent-ink);font-family:var(--mono);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.swaps{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:10px;background:var(--sunk);min-width:0}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -2px;scrollbar-width:thin}
.cat{flex:none;min-height:36px;padding:4px 12px;border-radius:999px;font-size:14px;font-weight:500}
.cat.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.swapopt{text-align:left;font-weight:500;min-height:48px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.swapopt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.checks{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;gap:12px;align-items:center;min-height:44px;cursor:pointer;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent)}
.ck input:checked+span{color:var(--muted);text-decoration:line-through}
details.howto{font-size:15px;border-top:1px solid var(--line);padding-top:8px}
details.howto summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:32px;display:flex;align-items:center}
details.howto ol{margin:6px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details.howto .watch{margin:0 0 8px;font-size:14px;color:var(--muted)}
details.howto a{color:var(--accent);font-weight:600}
details.howto.inlog{border:1px solid var(--accent);border-radius:10px;padding:0 12px;background:var(--accent-soft)}
details.howto.inlog summary{min-height:44px}
details.howto.inlog summary::before{content:"▸";margin-right:8px}
details.howto.inlog[open] summary::before{content:"▾"}
details.howto.inlog[open]{padding-bottom:12px}
.plan-list li.pl{display:block}
.plan-list .pl-top{display:flex;justify-content:space-between;gap:12px}
.plan-list details.howto{border-top:0;padding-top:4px}

/* Food actions, review sheet, finder */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;line-height:1.15;min-height:72px;padding:8px 6px;text-align:center}
.act svg{width:24px;height:24px}
.act.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.fitem{all:unset;cursor:pointer;display:flex;flex-direction:column;min-width:0;border-radius:6px}
.fitem:focus-visible{outline:3px solid var(--accent)}
.fitem .fn{overflow-wrap:anywhere}
.foods .mac{text-align:right}
#sheet{position:fixed;inset:0;z-index:30}
.scrim{position:absolute;inset:0;background:rgba(6,14,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px;padding:16px max(16px,max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px))) calc(18px + max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))) max(16px,max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px)))}
.sheet .photo{width:100%;max-height:200px;object-fit:cover;border-radius:6px}
.sheet .mg{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.sheet .mg{grid-template-columns:1fr 1fr}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pick{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.pick button.primary{min-height:38px;padding:6px 14px;flex:none}
.rest{border-top:2px solid var(--line);padding-top:10px}
.rest .pick{padding-left:10px;border-top:0;border-left:3px solid var(--accent-soft);margin-top:6px}
ul.safe{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:15px}
.toggle{flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* Status dashboard */
.hud{position:relative;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.hud::before,.hud::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--accent);border-style:solid;opacity:.8}
.hud::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.hud::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border:1px solid currentColor;border-radius:4px;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor}
.tag.good,.v.good{color:var(--good)} .tag.warn,.v.warn{color:var(--warn)} .tag.bad,.v.bad{color:var(--bad)}
.readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ro{background:var(--sunk);padding:9px 8px;min-width:0}
.readouts .ro:last-child:nth-child(odd){grid-column:1/-1}
.ro .k{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ro .v{font-family:var(--mono);font-size:clamp(15px,4.6vw,22px);font-weight:600;line-height:1.2;white-space:nowrap}
.ro .v.ket{color:var(--ketone);font-size:clamp(12px,3.6vw,17px)}
.ro .u{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:22px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--muted);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .ax.sm{font-size:9px}
.chart .ax.hi{fill:var(--accent)}
.chart .goal{stroke:var(--good);stroke-width:1;stroke-dasharray:4 4}
.chart .goaltx{fill:var(--good)}
.chart .now{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(53,230,189,.6))}
.chart .ln.proj{stroke-dasharray:6 5;opacity:.75;filter:none}
.chart .wdot{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.chart .end{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.chart .def{fill:var(--accent)} .chart .sur{fill:var(--carb)}
.chart .nod{fill:var(--line)}
.kb.k0,.sw.k0{fill:#6e6a55;background:#6e6a55} .kb.k1,.sw.k1{fill:#e6a7c4;background:#e6a7c4} .kb.k2,.sw.k2{fill:#d277aa;background:#d277aa}
.kb.k3,.sw.k3{fill:#b4448a;background:#b4448a} .kb.k4,.sw.k4{fill:#8a2b86;background:#8a2b86} .kb.k5,.sw.k5{fill:#5e1f74;background:#5e1f74}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-family:var(--mono);color:var(--ink)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;flex:none}
.sw.def{background:var(--accent)} .sw.sur{background:var(--carb)} .sw.ln{height:2px;background:var(--accent)} .sw.lnp{height:0;border-top:2px dashed var(--accent)} .sw.wd{border-radius:50%;border:2px solid var(--ink)}
.kq{display:inline-flex;align-items:center;gap:6px}
ul.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.tips li{padding-left:18px;position:relative}
ul.tips li::before{content:"›";position:absolute;left:2px;color:var(--accent);font-weight:700}
.plan{display:flex;flex-direction:column;gap:8px}
.pday{border-left:2px solid var(--accent);padding:4px 0 4px 10px;display:flex;flex-direction:column;gap:2px;font-size:15px}
.klevels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.klevels button{display:flex;align-items:center;gap:6px;font-size:14px;min-height:40px;padding:6px 8px}
.klevels button.sel{border-color:var(--ketone);box-shadow:inset 0 0 0 1px var(--ketone)}
.stepsrow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.stepsrow button{flex:none}

/* ---------- How-to cues (written for Nathan: returning intermediate, 245 lb, knees and back first) ---------- */
const HOWTO = {
 "Back squat or hack squat":{c:["Bar on your upper traps, hands just outside shoulders, squeeze the bar to lock your upper back.","Big breath into your belly, brace, then sit down between your heels with knees tracking over your toes.","Go as deep as you can keep a neutral back, usually thighs at or just below parallel.","Drive up through your whole foot, chest and hips rising together."],w:"Heels lifting or lower back rounding at the bottom. Stop the set a rep early rather than grind on week 1. On the hack squat, keep your back flat on the pad.",q:"back squat form"},
 "Goblet squat, 3 sec lower":{c:["Hold one dumbbell vertically against your chest, elbows pointing down.","Feet a bit wider than shoulders, toes slightly out.","Count 3 seconds on the way down, let your elbows brush the inside of your knees.","Stand up hard, keeping the dumbbell tight to your chest."],w:"Leaning forward as you tire. If your chest drops, the set is over.",q:"goblet squat form"},
 "Romanian deadlift":{c:["Stand tall with the bar at your hips, soft knees that stay soft the whole time.","Push your hips straight back like closing a car door with your butt. The bar slides down your thighs.","Stop when you feel a strong hamstring stretch, usually mid-shin. Back stays flat.","Squeeze your glutes to stand back up."],w:"Turning it into a squat by bending the knees more, or letting the bar drift away from your legs.",q:"romanian deadlift form"},
 "Dumbbell RDL":{c:["A dumbbell in each hand in front of your thighs, soft knees.","Hips back, dumbbells skim your legs on the way down.","Feel the hamstring stretch, keep your back flat, then drive your hips forward to stand."],w:"Rounding your upper back to reach lower. Depth comes from the hips, not the spine.",q:"dumbbell romanian deadlift form"},
 "Heavy dumbbell RDL":{c:["Heaviest pair you can hold with a flat back. Use straps if your grip goes first.","Hips back, dumbbells close to your legs, slow 3-second lowering.","Stop at the stretch, pause 1 second, then drive up hard."],w:"Same as RDLs: back stays flat, knees stay soft.",q:"dumbbell romanian deadlift form"},
 "Leg press":{c:["Feet shoulder width, mid-platform. Lower back and hips stay glued to the pad.","Lower until your knees are around 90 degrees or just past, without your tailbone curling up.","Press through your whole foot. Don't lock your knees out hard at the top."],w:"Your hips peeling off the seat at the bottom. That's too deep for now.",q:"leg press form"},
 "Bulgarian split squat":{c:["Back foot laces-down on a bench, front foot far enough forward that your knee stays roughly over your foot.","Drop your back knee straight down toward the floor, torso slightly forward.","Push through the front heel. Do all reps on one leg, then switch.","Hold dumbbells only once bodyweight feels steady."],w:"Wobbling. Use a hand on a rack or wall for balance; it doesn't make it easier on your legs.",q:"bulgarian split squat form"},
 "Lying or seated leg curl":{c:["Line your knee up with the machine's pivot point, pad just above your heels.","Curl all the way in, squeeze 1 second.","Take 2-3 seconds to let it back out."],w:"Hips lifting off the pad on the lying version. Lower the weight.",q:"leg curl form"},
 "Single-leg dumbbell RDL":{c:["Dumbbell in the hand opposite your standing leg.","Hinge forward while your free leg swings back in a straight line with your body.","Hips stay square to the floor. Go until you feel the stretch, then stand."],w:"Hips opening up toward the ceiling. Touch a wall or bench with your free hand if balance is the limit.",q:"single leg dumbbell rdl form"},
 "Standing calf raise":{c:["Balls of your feet on the edge, knees straight but not locked.","Lower your heels all the way down and pause 1 second in the stretch.","Rise as high as you can, pause 1 second at the top."],w:"Bouncing. Calves only grow from full, slow reps.",q:"standing calf raise form"},
 "Single-leg calf raise on a step, holding a dumbbell":{c:["One foot on a step, dumbbell in the same-side hand, other hand on a wall.","Full stretch at the bottom with a 1-second pause, then all the way up.","All reps on one side, then switch."],w:"Bouncing out of the bottom.",q:"single leg calf raise form"},
 "Hanging knee raise":{c:["Hang from a bar, shoulders pulled slightly down, no swinging.","Curl your pelvis up as you bring your knees to your chest. Think tail tucking under.","Lower slowly. Use the captain's chair (forearm pads) if grip gives out first."],w:"Swinging for momentum. A slow 8 beats a sloppy 15.",q:"hanging knee raise form"},
 "Dead bug":{c:["On your back, arms straight up, knees bent at 90 degrees over your hips.","Press your lower back into the floor and keep it there.","Slowly lower the opposite arm and leg toward the floor, exhale, and return. Alternate sides."],w:"Your lower back arching off the floor. Make the range smaller instead.",q:"dead bug exercise"},
 "Barbell bench press":{c:["Eyes under the bar, feet planted, shoulder blades pinched together and down.","Grip a bit wider than shoulders, wrists stacked over elbows.","Lower to your lower chest with elbows about 45 degrees from your body, touch, press up and slightly back.","Use a spotter or safety pins. You're coming back from a layoff."],w:"Elbows flaring straight out to the sides, or butt lifting off the bench.",q:"bench press form"},
 "Dumbbell bench press, or feet-up push-ups":{c:["Dumbbells: kick them up from your knees, shoulder blades pinched, lower until they're level with your chest, press up and in.","Push-ups: feet on the bench, body in one straight line, chest to just above the floor.","Elbows about 45 degrees from your body either way."],w:"Hips sagging on push-ups. Squeeze glutes and abs.",q:"dumbbell bench press form"},
 "Chest-supported row":{c:["Chest on the pad, let your arms hang fully.","Pull your elbows back toward your hips, squeeze your shoulder blades together for 1 second.","Lower all the way to a full stretch."],w:"Lifting your chest off the pad to cheat the weight up.",q:"chest supported row form"},
 "One-arm dumbbell row":{c:["One knee and hand on a bench, back flat, dumbbell hanging under your shoulder.","Pull the dumbbell toward your hip, not your armpit.","Lower to a full stretch every rep."],w:"Twisting your torso open to lift heavier.",q:"one arm dumbbell row form"},
 "Seated dumbbell shoulder press":{c:["Bench upright or one notch back, dumbbells at shoulder height, palms forward or slightly in.","Press up and slightly in until your arms are straight, without banging the dumbbells.","Lower to about ear level, under control."],w:"Arching your lower back off the pad. Ribs down.",q:"seated dumbbell shoulder press form"},

 "Cable pulldown, or dumbbell pullover":{c:["Cable: same as a lat pulldown, kneeling or seated, elbows driving to your sides.","Pullover: upper back across a bench, one dumbbell held over your chest with both hands.","Lower it back behind your head with a slight elbow bend until your lats stretch, then pull it back over your chest."],w:"On pullovers, going so far back your ribs flare and your back arches.",q:"dumbbell pullover form"},
 "Dumbbell lateral raise":{c:["Light dumbbells, slight bend in the elbows, lean forward just a little.","Raise out to the sides to shoulder height, leading with your elbows.","Lower slowly, about 2-3 seconds."],w:"Shrugging or swinging. This is a light-weight, strict move.",q:"dumbbell lateral raise form"},
 "Cable triceps pushdown":{c:["Elbows pinned at your sides, slight forward lean.","Push down until your arms are fully straight, squeeze.","Let your forearms come up to just past 90 degrees without your elbows moving."],w:"Elbows drifting forward so your shoulders do the work.",q:"cable triceps pushdown form"},
 "Overhead dumbbell triceps extension":{c:["Seated with back support, one dumbbell held overhead with both hands.","Lower it behind your head, elbows pointing up and staying fairly narrow.","Straighten your arms fully."],w:"Elbows flaring wide. Go lighter than you think.",q:"overhead dumbbell triceps extension"},
 "Dumbbell curl":{c:["Stand tall, elbows at your sides.","Curl up while turning your palms up, squeeze at the top.","Lower slowly, all the way to straight arms."],w:"Swinging your hips to get the last reps.",q:"dumbbell curl form"},
 "Trap bar or conventional deadlift":{c:["Trap bar: stand centered, hips back, grab the handles, chest up. Conventional: bar over mid-foot, shins touch the bar.","Take the slack out: pull your chest up and squeeze your lats until the bar clicks against the plates.","Big brace, then push the floor away. Hips and shoulders rise together.","Stand tall at the top, then hinge back down under control."],w:"Lower back rounding, or hips shooting up first. Trap bar is the easier choice on your back right now.",q:"trap bar deadlift form"},

 "Dumbbell reverse lunge":{c:["Dumbbells at your sides, step one foot straight back.","Lower until your back knee nearly touches the floor.","Push through your front heel to return. Easier on the knees than forward lunges."],w:"Stepping back too short so your front knee shoots forward.",q:"dumbbell reverse lunge form"},
 "Barbell or machine hip thrust":{c:["Upper back on a bench edge, bar padded across your hip crease, feet flat about hip width.","Tuck your chin and ribs, then drive your hips up until your body is a flat table.","Squeeze glutes hard for 1 second at the top, then lower."],w:"Arching your lower back at the top instead of finishing with your glutes.",q:"barbell hip thrust form"},
 "Single-leg hip thrust off the bench":{c:["Upper back on the bench, one foot planted, other knee pulled toward your chest.","Drive up through the planted heel until hips are level and flat.","Pause 1 second, lower slowly. All reps one side, then switch."],w:"Hips tilting to one side.",q:"single leg hip thrust form"},
 "Leg extension":{c:["Line your knee up with the pivot, pad just above your ankles.","Straighten your legs fully and squeeze your quads 1 second.","Lower over 2-3 seconds."],w:"Kicking the weight up. Stay smooth if your knees are cranky.",q:"leg extension form"},
 "Dumbbell step-up":{c:["Bench or box at knee height or a bit lower. Dumbbells at your sides.","Plant your whole foot on top and drive up through that heel.","Step down slowly with the same leg doing the work. All reps one side, then switch."],w:"Pushing off the back foot. The top leg does the lifting.",q:"dumbbell step up form"},
 "Seated calf raise":{c:["Pad snug on your lower thighs, balls of your feet on the edge.","Lower your heels for a deep stretch, pause 1 second.","Rise all the way up, pause 1 second."],w:"Bouncing through half reps.",q:"seated calf raise form"},
 "Seated calf raise, dumbbells on knees":{c:["Sit on a bench, balls of your feet on a plate or step, dumbbells standing on your knees.","Lower your heels for a stretch, then rise as high as you can.","Pause at both ends."],w:"Short range. Slow and full instead.",q:"seated dumbbell calf raise"},
 "Pallof press or plank":{c:["Pallof: stand side-on to a cable at chest height, handle at your sternum, press it straight out and hold without letting your body twist.","Plank: forearms under shoulders, body one straight line, squeeze glutes and pull your elbows toward your toes.","Breathe normally. Log the seconds you held."],w:"Hips sagging or hiking up on the plank.",q:"pallof press form"},
 "Side plank":{c:["Elbow under your shoulder, feet stacked or staggered.","Lift hips so your body is one straight line from head to feet.","Hold without letting your hips sink. Drop to your knees if needed."],w:"Hips drifting back behind you.",q:"side plank form"},
 "Pull-up (assisted if needed) or lat pulldown":{c:["Use the assisted machine or a band until you can do 6 clean reps on your own.","Start from a dead hang, pull your chest to the bar by driving elbows down.","Lower all the way to straight arms every rep."],w:"Half reps and kipping. Full range on fewer reps beats more half reps.",q:"assisted pull up form"},
 "Inverted row, or band pulldown":{c:["Inverted row: lie under a Smith bar or sturdy table edge, heels on the floor, body in a straight line.","Pull your chest to the bar, squeeze shoulder blades, lower slowly.","Bend your knees to make it easier, raise your feet to make it harder."],w:"Hips sagging. Squeeze your glutes.",q:"inverted row form"},
 "Incline dumbbell press":{c:["Bench at about 30 degrees, shoulder blades pinched.","Lower the dumbbells to your upper chest, elbows about 45 degrees out.","Press up and slightly in."],w:"Setting the bench too steep so it turns into a shoulder press.",q:"incline dumbbell press form"},
 "Seated cable row":{c:["Sit tall, slight knee bend, chest up.","Pull the handle to your belly button, elbows close to your body, squeeze 1 second.","Let your arms extend fully and your shoulder blades spread, without rocking back and forth."],w:"Rocking your torso to move the weight.",q:"seated cable row form"},
 "Chest-supported dumbbell row on an incline bench":{c:["Bench at about 30-45 degrees, lie face-down with your chest on the pad.","Let the dumbbells hang, then row them toward your hips.","Squeeze 1 second, lower to a full stretch."],w:"Chest lifting off the pad.",q:"chest supported dumbbell row"},
 "Machine chest press or dips":{c:["Machine: handles at mid-chest height, shoulder blades back, press without locking out hard.","Dips: lean slightly forward, lower until your upper arms are about parallel to the floor, press up.","Use the assisted dip machine if bodyweight dips are too much right now."],w:"Going too deep on dips. Stop if the front of your shoulder pinches.",q:"assisted dip form"},
 "Push-ups, 2 reps short of failure":{c:["Hands a bit wider than shoulders, body in a straight line.","Chest to just above the floor, elbows about 45 degrees out.","Stop each set when you think 2 more reps would be your max. Log the reps you did."],w:"Sagging hips. Use a bench under your hands if floor push-ups are too hard.",q:"push up form"},
 "Face pull":{c:["Rope at upper chest to face height, step back, arms straight.","Pull the rope toward your forehead, splitting the ends apart, elbows high.","Finish with your hands beside your ears, like a double-biceps pose. Pause, return slowly."],w:"Going heavy and leaning back. This is a light posture move.",q:"face pull form"},
 "Dumbbell rear delt fly":{c:["Hinge forward to almost parallel, or lie face-down on an incline bench.","Light dumbbells, slight elbow bend, raise out to the sides.","Lead with your pinkies and squeeze between your shoulder blades."],w:"Shrugging toward your ears.",q:"dumbbell rear delt fly"},
 "Hammer curl":{c:["Palms facing each other the whole time, elbows at your sides.","Curl up toward your shoulder, squeeze.","Lower slowly to straight arms."],w:"Swinging.",q:"hammer curl form"},
 "Overhead cable triceps extension":{c:["Rope on a low or mid pulley, face away from the stack, staggered stance, slight forward lean.","Start with your hands behind your head, elbows pointing forward and up.","Straighten your arms fully overhead, then let them bend back for a deep stretch."],w:"Elbows flaring wide.",q:"overhead cable triceps extension"},
 "Dumbbell skull crusher on the bench":{c:["Lie on the bench, dumbbells held straight up over your shoulders, palms facing each other.","Bend only at the elbows to lower the dumbbells beside your head.","Straighten your arms back up."],w:"Elbows drifting toward your face or out wide. Go light.",q:"dumbbell skull crusher form"}
};
function howtoHtml(name,open,k){
  const h=HOWTO[name]; if(!h) return "";
  const url="https://www.youtube.com/results?search_query="+encodeURIComponent(h.q);
  return `<details class="howto${k!=null?" inlog":""}"${open?" open":""}${k!=null?` data-how="${k}"`:""}><summary>How to do it</summary><ol>${h.c.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${h.w?`<p class="watch"><b>Watch for:</b> ${esc(h.w)}</p>`:""}<a href="${url}" target="_blank" rel="noopener">Watch a demo video ↗</a></details>`;
}

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}

const CACHE="liftlog-cache-v1", PENDING="liftlog-pending-v1", DRAFT="liftlog-draft-v1", UI="liftlog-ui-v1";
let docs = lsGet(CACHE,{});          // id -> data
let pending = lsGet(PENDING,{});     // id -> data | null (delete), not yet synced
let col = null, mode = "connecting";
function view(){ const all={...docs}; for(const [k,v] of Object.entries(pending)){ if(v===null) delete all[k]; else all[k]=v; } return all; }
function settings(){ return {...DEFAULTS, ...(view().settings||{})}; }
function sessions(){ return Object.entries(view()).filter(([k,v])=>v&&v.kind==="session").map(([k,v])=>({...v,id:k})).sort((a,b)=>(b.date+b.ts).localeCompare(a.date+a.ts)); }
function day(date){ return view()["d-"+date] || {kind:"day",date,foods:[],water:0,weight:null}; }

async function put(id,data){
  pending[id]=data; lsSet(PENDING,pending); render();
  await flush();
}
let flushing=null;
async function flush(){
  if(!col) return;
  if(flushing) { await flushing; if(!Object.keys(pending).length) return; }
  flushing=flushOnce(); try{ await flushing; } finally { flushing=null; }
}
async function flushOnce(){
  for(const [id,data] of Object.entries(pending)){
    try{
      if(data===null) await col.doc(id).delete(); else await col.doc(id).set(data);
      if(data===null) delete docs[id]; else docs[id]=data;
      if(pending[id]===data){ delete pending[id]; }
      lsSet(PENDING,pending); lsSet(CACHE,docs);
    }catch(e){ lastSyncErr=(e&&e.code)||"error"; setSync("off","Couldn't save to your account ("+lastSyncErr+"). Kept on this phone."); return; }
  }
  setSync("on");
}
function setSync(state,msg){
  mode=state; const el=$("#sync");
  const n=Object.keys(pending).length;
  if(state==="on") el.innerHTML=window.NATIVE?'<span class="dot on"></span><b>Saved on phone</b>':'<span class="dot on"></span><b>Synced</b>'+(n?" · "+n+" waiting":"");
  else if(state==="off") el.innerHTML='<span class="dot off"></span><b>On this phone</b>'+(n?" · "+n+" not uploaded":"");
  else el.innerHTML='<span class="dot"></span>Connecting…';
  el.title=msg||"";
}
async function connect(){
  try{
    if(!window.claude||!claude.use){ setSync("off"); return; }
    const [db,user] = await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){ setSync("off","Sign in to claude.ai to sync"); return; }
    const uid = await user.id();
    if(!uid){ setSync("off","Sign in to claude.ai to sync"); return; }
    col = db.collection("data/users/"+uid);
    col.onSnapshot(snap=>{
      const fresh={}; snap.docs.forEach(d=>{ const v=d.data(); if(v) fresh[d.id]=v; });
      docs=fresh; lsSet(CACHE,docs); setSync("on"); render();
    }, err=>{ setSync("off","Sync paused: "+(err&&err.code)); });
    setSync("on"); flush();
    // keep retrying anything still waiting: every 20 s, and whenever the app comes back to the screen
    setInterval(()=>{ if(Object.keys(pending).length) flush(); },20000);
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&Object.keys(pending).length) flush(); });
    window.addEventListener("online",()=>flush());
  }catch(e){ setSync("off"); }
}

function weekNo(date){ const s=settings(); const d=(parseYmd(date)-parseYmd(s.startDate))/864e5; return Math.max(1,Math.floor(d/7)+1); }
function phase(week){
  if(week<=2) return {name:"On-ramp",note:"2 sets per exercise, leave 3-4 reps in the tank",sets:()=>2};
  if(week<=8) return {name:"Build 1",note:"Full sets, leave 1-3 reps in the tank",sets:s=>s};
  if(week===9) return {name:"Deload",note:"Half the sets, same weights, leave 4 reps",sets:s=>Math.ceil(s/2)};
  const w=(week-10)%7; // Build 2 (6 weeks) then deload, repeating
  if(w===6) return {name:"Deload",note:"Half the sets, same weights, leave 4 reps",sets:s=>Math.ceil(s/2)};
  return {name:"Build 2",note:"Full sets. Swap 1-2 lifts for a close variant if you like",sets:s=>s};
}
function nextWorkoutId(){
  const ss=sessions(); if(!ss.length) return settings().firstWorkout||"L1";
  const i=WORKOUTS.findIndex(w=>w.id===ss[0].workout); return WORKOUTS[(i+1)%4].id;
}

function exVariant(w,i,c){ const e=WMAP[w].ex[i]; const base={...e}; delete base.h;
  if((c==="h"||c===true)&&e.h) return {...base,...e.h,key:w+"-"+i+"-h",kind:"hotel"};
  if(typeof c==="string"&&c.startsWith("x:")&&LIB[c.slice(2)]){ const L=LIB[c.slice(2)]; return {n:L.n,s:base.s,r:L.r,inc:L.inc,bw:L.bw,sec:L.sec,each:L.each,rest:base.rest,key:"lib:"+L.n,kind:"swap"}; }
  return {...base,key:w+"-"+i,kind:"plan"}; }
function savedSwap(w,i){ const v=(settings().swaps||{})[w+"-"+i]; return typeof v==="string"&&v.startsWith("x:")&&LIB[v.slice(2)]?v:null; }
function targetReps(v){ const rg=range(v.r); return rg?String(rg.hi):""; }
function lastFor(key,beforeId){
  for(const s of sessions()){ if(s.id===beforeId) continue; const e=(s.exercises||[]).find(x=>x.key===key); if(e&&e.sets&&e.sets.length) return {date:s.date,sets:e.sets,note:e.note||""}; }
  return null;

function hintFor(v,last,targetSets){
  const rg=range(v.r); if(!last) return {t: v.sec?"First time: hold for "+(rg?rg.lo:30)+" seconds with good form.": v.bw?"First time: stop 2-3 reps short of failure.":"First time: pick a weight you could do for "+(rg?rg.hi+2:"a few more")+" reps.",up:false};
  if(!rg) return {t:"Beat last time's reps.",up:false};
  const work=last.sets.filter(s=>numv(s.r)!=null);
  const allTop = work.length>=Math.min(targetSets,last.sets.length) && work.length>0 && work.every(s=>numv(s.r)>=rg.hi);
  const topW = work.length? Math.max(...work.map(s=>numv(s.w)||0)) : 0;
  if(allTop && !v.bw && !v.sec) return {t:"You hit "+rg.hi+" on every set. Go to "+(topW+(v.inc||5))+" lb and work back up from "+rg.lo+".",up:true,w:topW+(v.inc||5)};
  if(allTop && v.sec) return {t:"Held the top time on every set. Add a few seconds or make it harder.",up:true};
  if(allTop && v.bw) return {t:"Top of the range on every set. Add reps, a pause, or load.",up:true};

    addFoods(foodDate,items.map(f=>({...plainFood(f),src:"copied"}))); fx.pastSel=new Set(); fx.panel=null; toast(`Added ${items.length} item${items.length>1?"s":""} to ${dayWord}`); };

/* ---------- Claude: photos, descriptions, finder ---------- */
let sampleP=null;
const getSample=()=>(sampleP||(sampleP=(window.claude&&claude.use?claude.use("sample"):Promise.resolve(null)).catch(()=>null)));
function ctxText(){ const s=settings(); return `The user is a 245 lb man on strict keto (no more than ${s.carbs} g net carbs a day), lifting weights four days a week, and taking tirzepatide, so appetite is low and hitting protein (${s.proteinMin} to ${s.protein} g a day) matters most.`; }
function remainingText(){ const s=settings(); const t=totals(day(today())); return `Eaten today so far: ${Math.round(t.p)} g protein, ${r1(t.c)} g net carbs, ${Math.round(t.f)} g fat, ${Math.round(t.kcal)} kcal. Left today: ${Math.max(0,Math.round(s.protein-t.p))} g protein, ${Math.max(0,r1(s.carbs-t.c))} g net carbs, ${Math.max(0,Math.round(s.fat-t.f))} g fat.`; }
const ITEM_SHAPE=`{"name": string (short, include brand if packaged), "portion": string (e.g. "1 bar (40 g)" or "about 6 oz"), "cal": number, "protein": number, "fat": number, "carbs": number (total), "fiber": number, "net": number (net carbs = total carbs - fiber - sugar alcohols like erythritol or allulose; count maltitol as half), "verdict": "great" | "ok" | "avoid" (for strict keto), "note": string (one short sentence, plain words)}`;
async function askClaude(prompt,images){
  const sample=await getSample();
  if(!sample) throw {code:"not_granted"};
  const opts={modelTier:"default"}; if(images&&images.length) opts.images=images;
  return await sample.json(prompt,opts);
}
function aiError(e){
  const c=e&&e.code;
  if(c==="no_key") return "Add your Anthropic API key in the Setup tab to use photos and Claude's suggestions.";
  if(c==="bad_key") return "Your Anthropic API key was turned down. Check it in the Setup tab.";
  if(c==="no_credit") return "Your Anthropic account is out of credit. Add credit at console.anthropic.com, then try again.";
  if(c==="offline") return "No internet connection. Try again when you're back online.";
  if(c==="not_granted") return "This needs permission to use Claude. Open the app in Claude, tap the button again and choose Allow.";
  if(c==="rate_limited") return "Claude is busy for a moment. Wait a minute and try again.";
  if(c==="images_unavailable"||c==="image_rejected") return "That photo couldn't be read. Try again with a JPEG or PNG photo.";
  if(c==="invalid_json"||c==="empty_completion") return "Claude's answer came back garbled. Try once more.";
  return "Something went wrong reaching Claude. Check your connection and try again.";
}
async function shrink(file,max){
  let src,w,h;
  try{ src=await createImageBitmap(file); w=src.width; h=src.height; }
  catch(e){ src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);}); w=src.naturalWidth; h=src.naturalHeight; }
  const k=Math.min(1,max/Math.max(w,h)); const c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  return {blob,url:URL.createObjectURL(blob)};
}
function cleanItem(it){
  const n=k=>Math.max(0,Number(it[k])||0);
  const carbs=n("carbs"), fiber=n("fiber"); const net=it.net!=null?n("net"):Math.max(0,carbs-fiber);
  return {name:String(it.name||"Food").slice(0,120),portion:String(it.portion||""),cal:n("cal"),protein:n("protein"),fat:n("fat"),net,verdict:["great","ok","avoid"].includes(it.verdict)?it.verdict:"",note:String(it.note||"").slice(0,200),servings:1};
}
function itemToFood(it,src,place){ const sv=+it.servings||1; return plainFood({n:(it.name||"Food").slice(0,120),p:it.protein*sv,c:it.net*sv,f:it.fat*sv,kcal:it.cal*sv,portion:(it.portion||"")+(sv!==1?` ×${r1(sv)}`:""),src,place}); }

/* Review / edit sheet */
let sheet=null;
function openSheet(s){ sheet=s; drawSheet(); }
function closeSheet(){ sheet=null; drawSheet(); }
function drawSheet(){
  const root=$("#sheet"); if(!sheet){ root.innerHTML=""; root.hidden=true; return; }
  const s=sheet; root.hidden=false;
  if(s.kind==="steps"){
    const body=s.status==="loading"?`<div class="panel row"><span class="spin"></span><span class="muted">${esc(s.loadingText)}</span></div>`
      :s.error?`<div class="panel"><div>${esc(s.error)}</div>${s.retry?`<button class="primary" data-sh="retry">Try again</button>`:""}</div>`
      :`<div class="panel">${s.days.map((d,i)=>`<div class="grid2"><label class="f">Date<input type="date" data-sd="${i}" value="${d.date}" max="${today()}"></label><label class="f">Steps<input data-ss="${i}" inputmode="numeric" value="${d.steps}"></label></div>`).join("")}${s.note?`<div class="small muted">${esc(s.note)}</div>`:""}</div>`;
    root.innerHTML=`<div class="scrim" data-sh="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Steps"><div class="spread"><h2>Steps</h2><button class="xbtn" data-sh="close" aria-label="Close">×</button></div>${s.photoUrl?`<img class="photo" src="${s.photoUrl}" alt="Your screenshot" style="object-fit:contain">`:""}${body}${s.days&&s.status!=="loading"&&!s.error?`<button class="primary big" data-sh="ssave">Save ${s.days.length>1?s.days.length+" days":"steps"}</button>`:""}</div></div>`;
    root.querySelectorAll("[data-sd]").forEach(i=>i.onchange=()=>{s.days[+i.dataset.sd].date=i.value});
    root.querySelectorAll("[data-ss]").forEach(i=>i.oninput=()=>{s.days[+i.dataset.ss].steps=Math.round(numv(String(i.value).replace(/[,\s]/g,""))||0)});
    return;
  }
  if(s.kind==="ketone"){
    const body=s.status==="loading"?`<div class="panel row"><span class="spin"></span><span class="muted">${esc(s.loadingText)}</span></div>`
      :s.error?`<div class="panel"><div>${esc(s.error)}</div>${s.retry?`<button class="primary" data-sh="retry">Try again</button>`:""}</div>`
      :`<div class="panel"><div class="eyebrow">Reading</div><div class="klevels">${KLEVELS.map(x=>`<button data-sh="klev" data-l="${x.k}" class="${s.level===x.k?"sel":""}" aria-pressed="${s.level===x.k}"><i class="sw k${KIDX[x.k]}"></i>${x.l}</button>`).join("")}</div>${s.note?`<div class="small muted">${esc(s.note)}</div>`:""}<div class="small muted">Tap a different level if the strip looks different to you.</div></div>`;
    root.innerHTML=`<div class="scrim" data-sh="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Ketone strip"><div class="spread"><h2>Ketone strip</h2><button class="xbtn" data-sh="close" aria-label="Close">×</button></div>${s.photoUrl?`<img class="photo" src="${s.photoUrl}" alt="Your strip">`:""}${body}${s.level&&s.status!=="loading"&&!s.error?`<button class="primary big" data-sh="ksave">Save ${esc(KLEVELS[KIDX[s.level]].l)}</button>`:""}</div></div>`;
    return;
  }
  const vcol=v=>v==="great"?"var(--good)":v==="avoid"?"var(--bad)":"var(--warn)";
  const vtxt=v=>v==="great"?"Great for keto":v==="avoid"?"Not keto friendly":"OK in moderation";
  let body="";
  if(s.status==="loading") body=`<div class="panel row"><span class="spin"></span><span class="muted">${esc(s.loadingText||"Reading your photo…")}</span></div>`;
  else if(s.error) body=`<div class="panel"><div>${esc(s.error)}</div>${s.retry?`<button class="primary" data-sh="retry">Try again</button>`:""}</div>`;
  else body=(s.items||[]).map((it,i)=>`<div class="panel item" data-i="${i}">
      <label class="f">Food<input data-f="name" value="${esc(it.name)}"></label>
      <label class="f">Portion<input data-f="portion" value="${esc(it.portion||"")}" placeholder="e.g. 1 bowl"></label>
      ${it.verdict?`<div class="small" style="color:${vcol(it.verdict)};font-weight:600">${vtxt(it.verdict)}${it.note?` <span class="muted" style="font-weight:400">· ${esc(it.note)}</span>`:""}</div>`:""}
      <div class="grid4 mg">
        <label class="f">Protein g<input data-f="protein" inputmode="decimal" value="${r1(it.protein)}"></label>
        <label class="f">Net carbs g<input data-f="net" inputmode="decimal" value="${r1(it.net)}"></label>
        <label class="f">Fat g<input data-f="fat" inputmode="decimal" value="${r1(it.fat)}"></label>
        <label class="f">kcal<input data-f="cal" inputmode="decimal" value="${Math.round(it.cal)}"></label>
      </div>
      ${s.edit?"":`<div class="spread"><span class="row" style="gap:6px"><button data-step="-0.5" aria-label="Fewer servings">−</button><b class="num" style="min-width:36px;text-align:center">${r1(it.servings||1)}</b><button data-step="0.5" aria-label="More servings">+</button><span class="small muted">servings</span></span>${s.items.length>1?`<button class="ghost" data-drop="${i}">Remove</button>`:""}</div>`}
    </div>`).join("");
  const ready=s.status!=="loading"&&!s.error&&(s.items||[]).length;
  root.innerHTML=`<div class="scrim" data-sh="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(s.title)}">
    <div class="spread"><h2>${esc(s.title)}</h2><button class="xbtn" data-sh="close" aria-label="Close">×</button></div>
    ${s.photoUrl?`<img class="photo" src="${s.photoUrl}" alt="Your photo">`:""}
    ${s.banner?`<div class="banner">${esc(s.banner)}</div>`:""}
    ${body}
    ${s.needLabel&&s.status!=="loading"?`<button data-sh="label">Add a photo of the Nutrition Facts for exact numbers</button>`:""}
    ${s.edit?`<button class="primary big" data-sh="save">Save changes</button><button data-sh="again">${s.date===today()?"Add again today":"Add to today too"}</button><button class="danger" data-sh="delete">Delete</button>`
      :ready?`<button class="primary big" data-sh="log">Log ${s.items.length>1?s.items.length+" items":"it"}${foodDate===today()?"":" to "+fmtShort(foodDate)}</button>`:""}
  </div></div>`;
}
document.addEventListener("input",e=>{ const box=e.target.closest&&e.target.closest("#sheet .item"); if(!box||!sheet) return; const f=e.target.dataset.f; if(!f) return; const it=sheet.items[+box.dataset.i]; it[f]=(f==="name"||f==="portion")?e.target.value:(numv(e.target.value)||0); });
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("#sheet [data-sh],#sheet [data-step],#sheet [data-drop]"); if(!b||!sheet) return;
  if(b.dataset.sh==="scrim"&&e.target!==b) return;
  if(b.dataset.step){ const it=sheet.items[+b.closest(".item").dataset.i]; it.servings=Math.max(0.5,r1((it.servings||1)+ +b.dataset.step)); drawSheet(); return; }
  if(b.dataset.drop){ sheet.items.splice(+b.dataset.drop,1); drawSheet(); return; }
  const a=b.dataset.sh;
  if(a==="close"||a==="scrim") closeSheet();
  else if(a==="retry") sheet.retry&&sheet.retry();
  else if(a==="ssave"){ const ds=sheet.days.filter(d=>d.date&&d.steps>0); closeSheet(); ds.forEach(d=>saveSteps(d.date,d.steps)); toast(ds.length>1?`Steps saved for ${ds.length} days`:`${fmtK(ds[0]?ds[0].steps:0)} steps saved`); }
  else if(a==="klev"){ sheet.level=b.dataset.l; drawSheet(); }
  else if(a==="ksave"){ const l=sheet.level; closeSheet(); saveKetone(l,"photo"); }
  else if(a==="label") $("#camLabel").click();

const YELP="Yelp", YELP_TOOL="yelp_search_local_businesses";
async function yelpNearby(loc){
  try{
    const mcp=window.claude&&claude.use?await claude.use("mcp"):null; if(!mcp) return null;
    let props={}; try{ const dsc=await mcp.describeTool(YELP,YELP_TOOL); props=(dsc&&dsc.inputSchema&&dsc.inputSchema.properties)||{}; }catch(e){}
    const input={}; const key=["query","q","term","search","prompt","text"].find(k=>k in props)||"query";
    input[key]=`Restaurants with low-carb or keto-friendly options near ${loc}`; if("location" in props) input.location=loc;
    const res=await mcp.callTool(YELP,YELP_TOOL,input);
    const raw=res&&res.payload!=null?res.payload:((res&&res.content)||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
    const txt=typeof raw==="string"?raw:JSON.stringify(raw);
    return txt&&txt.length>20?txt.slice(0,14000):null;
  }catch(e){ return null; }
}

const KLEVELS=[{k:"negative",l:"Negative",mmol:0},{k:"trace",l:"Trace",mmol:0.5},{k:"small",l:"Small",mmol:1.5},{k:"moderate",l:"Moderate",mmol:4},{k:"large",l:"Large",mmol:8},{k:"very large",l:"Very large",mmol:16}];
const KIDX=Object.fromEntries(KLEVELS.map((x,i)=>[x.k,i]));
function ketones(){ return Object.entries(view()).filter(([k,v])=>v&&v.kind==="ketone").map(([k,v])=>({...v,id:k})).sort((a,b)=>String(a.ts).localeCompare(String(b.ts))); }
function ketoneOn(date){ const ks=ketones().filter(k=>k.date===date); if(!ks.length) return null; return ks.reduce((m,k)=>(KIDX[k.level]??0)>(KIDX[m.level]??0)?k:m); }
function bodyInfo(){ const s=settings(); return {h:+s.heightIn||70,age:+s.age||40,guess:!(+s.heightIn&&+s.age)}; }
function bmr(lb){ const b=bodyInfo(); return 10*(lb/2.2046)+6.25*(b.h*2.54)-5*b.age+5; }
// MET-based exercise burn: kcal/min = MET * 3.5 * kg / 200
// Walking burn from watch steps: about 0.5 kcal per kg per km walked; stride ≈ 0.415 × height
function stepKcal(steps,lb){ const b=bodyInfo(); const km=steps*b.h*2.54*0.415/100000; return 0.5*(lb/2.2046)*km; }
function baseBurn(date,lb){ const st=+day(date).steps||0; return st? {kcal:bmr(lb)*1.2+stepKcal(st,lb),steps:st} : {kcal:bmr(lb)*1.3,steps:0}; }
const isWalk=t=>/walk|treadmill/i.test(t||"");
function exBurn(date,lb){
  const kg=lb/2.2046, rate=m=>m*3.5*kg/200; let k=0; const items=[];
  const hasSteps=(+day(date).steps||0)>0; // the watch already counts walking steps, so only add the extra effort of a walk
  const cw=(type,min)=>{ const met=/incline|stair|interval|row/i.test(type)?6:4.5; return rate(hasSteps&&isWalk(type)?Math.max(1,met-3.5):met)*min; };
  sessions().filter(x=>x.date===date).forEach(x=>{ const m=+x.minutes||55; k+=rate(3.5)*m; items.push((WMAP[x.workout]?WMAP[x.workout].name:"Lift")+" "+m+"m"); if(x.cardio){ k+=cw(x.cardio.type,+x.cardio.minutes||0); items.push(x.cardio.type+" "+x.cardio.minutes+"m"); } });
  activities().filter(a=>a.date===date&&a.act==="cardio").forEach(a=>{ k+=cw(a.type,+a.minutes||0); items.push(a.type+" "+a.minutes+"m"); });
  return {kcal:k,items,lift:sessions().some(x=>x.date===date),cardio:sessions().some(x=>x.date===date&&x.cardio)||activities().some(a=>a.date===date&&a.act==="cardio")};
}
const mondayOf=d=>{ const x=parseYmd(d); const wd=(x.getDay()+6)%7; return addDays(d,-wd); };
// Day-by-day model from the program start: intake, burn, balance, estimated weight
function model(){
  const s=settings(); const t=today(); const start=s.startDate<=t?s.startDate:t;
  const weighed=allDays().filter(d=>d.weight).map(d=>({date:d.date,w:+d.weight})).sort((a,b)=>a.date.localeCompare(b.date));
  const rows=[]; let est=+s.startWeight;
  for(let d=start; d<=t; d=addDays(d,1)){
    const dd=day(d); const tt=totals(dd); const logged=(dd.foods||[]).length>0;
    const wIn=weighed.find(x=>x.date===d); if(wIn) est=wIn.w; // a weigh-in resets the estimate
    const bb=baseBurn(d,est); const base=bb.kcal; const ex=exBurn(d,est); const burn=base+ex.kcal;
    const bal=logged? tt.kcal-burn : null;
    rows.push({date:d,logged,t:tt,base,steps:bb.steps,ex,burn,bal,est,weighed:wIn?wIn.w:null,ket:ketoneOn(d)});
    if(bal!=null&&d<t) est=est+bal/3500; // today isn't finished yet
  }
  const last7=rows.filter(r=>r.logged&&r.date<t).slice(-7);
  const avgBal=last7.length? last7.reduce((a,r)=>a+r.bal,0)/last7.length : null;
  const cur=rows.length?rows[rows.length-1].est:+s.startWeight;
  return {rows,weighed,avgBal,cur,lbWk:avgBal!=null?-avgBal*7/3500:null};
}

function weekSummary(m){
  const s=settings(); const mon=mondayOf(today()); const days=[]; for(let i=0;i<7;i++) days.push(addDays(mon,i));

  const cardio=sessions().filter(x=>x.date>=mon&&x.cardio).length+activities().filter(a=>a.date>=mon&&a.act==="cardio").length;
  const logged=rows.filter(r=>r.logged);
  const pAvg=logged.length?logged.reduce((a,r)=>a+r.t.p,0)/logged.length:null;
  const under=logged.filter(r=>r.t.c<=s.carbs).length;
  const balSum=logged.filter(r=>r.date<today()).reduce((a,r)=>a+r.bal,0);
  const sd=rows.filter(r=>r.steps>0); const stepDays=sd.length, stepAvg=stepDays?sd.reduce((a,r)=>a+r.steps,0)/stepDays:0;

document.addEventListener("change",e=>{ const i=e.target.closest&&e.target.closest(".stepsIn"); if(!i) return; const n=numv(String(i.value).replace(/[,\s]/g,"")); saveSteps(i.dataset.date,n||0); if(n) toast(fmtK(n)+" steps saved"); });
let stepsShotDate=null;
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest(".stepsShot"); if(!b) return; stepsShotDate=b.dataset.date; $("#camSteps").click(); });
async function onStepsShot(file){
  if(!file) return; const fallback=stepsShotDate||today();
  openSheet({kind:"steps",title:"Steps",status:"loading",loadingText:"Reading your Samsung Health screenshot…"});
  const s=sheet;
  try{ const img=await shrink(file,1600); s.photoUrl=img.url; s.images=[img.blob]; drawSheet(); }catch(e){ s.status=""; s.error="That image couldn't be opened. Try again."; drawSheet(); return; }
  const run=async()=>{ s.status="loading"; s.error=""; drawSheet();
    const prompt=`The image is a screenshot from Samsung Health (or a watch or phone fitness screen). Today is ${today()} (${fmtDate(today())}).
Read the step count. If the screen shows a daily list or a week chart with numbers, return every day you can read. Use the dates shown; "Today" means ${today()} and "Yesterday" means ${addDays(today(),-1)}. If no date is shown, use null.
Respond with only JSON: {"days": [{"date": "YYYY-MM-DD" or null, "steps": number}], "note": string (one short sentence)}`;
    try{ const out=await askClaude(prompt,s.images); if(sheet!==s) return;
      const ds=(out.days||[]).filter(d=>+d.steps>0).slice(0,14).map(d=>({date:/^\d{4}-\d\d-\d\d$/.test(d.date||"")&&d.date<=today()?d.date:fallback,steps:Math.round(+d.steps)}));
      if(!ds.length) throw {code:"empty_completion"};
      s.days=ds; s.note=out.note||""; s.status=""; }
    catch(e){ if(sheet!==s) return; s.status=""; s.error=e&&e.code==="empty_completion"?"I couldn't find a step count in that image. Try a screenshot of the Steps screen.":aiError(e); }
    drawSheet(); };
  s.retry=run; run();
}
function renderStatus(){
  const el=$("#v-status"); const s=settings(); const m=model(); const w=weekSummary(m);
  const tr=m.rows.find(r=>r.date===today())||{t:totals(day(today())),burn:baseBurn(today(),m.cur).kcal+exBurn(today(),m.cur).kcal,ex:exBurn(today(),m.cur),steps:+day(today()).steps||0};
  const tk=ketoneOn(today()); const b=bodyInfo();
  const hasWeigh=m.weighed.length>0; const lost=s.startWeight-m.cur;
  const toGoal=Math.max(0,m.cur-s.goalWeight); const weeks=m.lbWk>0?toGoal/m.lbWk:null;
  const goalDate=weeks!=null?addDays(today(),Math.round(weeks*7)):null;
  const tips=ruleTips(m,w);
  const nw=WMAP[nextWorkoutId()];
  const liftedToday=sessions().find(x=>x.date===today());
  const st=(v,lim)=>v>lim?"bad":v>lim*.8?"warn":"good";
  el.innerHTML=`
  <div class="hud">
    <div class="spread"><div><div class="eyebrow">Today · ${fmtDate(today())}</div><h2>Daily readout</h2></div><span class="tag ${tr.t.c>s.carbs?"bad":"good"}"><i></i>${tr.t.c>s.carbs?"Over carb limit":"Keto range"}</span></div>
    <div class="readouts">
      <div class="ro"><div class="k">Eaten</div><div class="v num">${fmtK(tr.t.kcal)}</div><div class="u">kcal</div></div>
      <div class="ro"><div class="k">Burn est.</div><div class="v num">${fmtK(tr.burn)}</div><div class="u">kcal by tonight</div></div>
      <div class="ro"><div class="k">Balance</div>${tr.t.kcal>0?`<div class="v num ${tr.t.kcal-tr.burn<=0?"good":"bad"}">${tr.t.kcal-tr.burn<=0?"−":"+"}${fmtK(Math.abs(tr.t.kcal-tr.burn))}</div><div class="u">kcal if you stop here</div>`:`<div class="v muted">—</div><div class="u">log food to see</div>`}</div>
      <div class="ro"><div class="k">Protein</div><div class="v num" style="color:var(--protein)">${Math.round(tr.t.p)}</div><div class="u">of ${s.proteinMin}-${s.protein} g</div></div>
      <div class="ro"><div class="k">Net carbs</div><div class="v num ${st(tr.t.c,s.carbs)}">${r1(tr.t.c)}</div><div class="u">of ${s.carbs} g max</div></div>
      <div class="ro"><div class="k">Fat</div><div class="v num" style="color:var(--fat)">${Math.round(tr.t.f)}</div><div class="u">of ${s.fat} g</div></div>
      <div class="ro"><div class="k">Steps</div><div class="v num ${tr.steps>=8000?"good":""}">${tr.steps?fmtK(tr.steps):"—"}</div><div class="u">${tr.steps?"≈ "+fmtK(stepKcal(tr.steps,m.cur))+" kcal walking":"not entered yet"}</div></div>
      <div class="ro"><div class="k">Water</div><div class="v num" style="color:var(--water)">${day(today()).water||0}</div><div class="u">of ${s.water} oz</div></div>
      <div class="ro"><div class="k">Ketones</div><div class="v ${tk?"ket":"muted"}">${tk?esc(KLEVELS[KIDX[tk.level]].l):"—"}</div><div class="u">${tk?KLEVELS[KIDX[tk.level]].mmol+" mmol/L":"no strip yet"}</div></div>
    </div>
    <div class="small muted">${liftedToday?`Trained today: ${esc(WMAP[liftedToday.workout]?.name||"Lift")}${tr.ex.items.length?" · "+esc(tr.ex.items.join(", ")):""}.`:`No workout logged today. Next up: ${esc(nw.name)} (${esc(nw.focus)}).`} Burn uses your weight, ${b.guess?"an assumed height of 5'10\" and age 40 (set yours in Setup)":"height and age"}, ${tr.steps?"your watch steps":"light daily activity (enter steps for a better number)"} and logged workouts.</div>
    ${stepsEntry(today())}
  </div>

  <div class="hud">
    <div class="spread"><div><div class="eyebrow">This week · from ${fmtShort(w.mon)}</div><h2>Food vs training</h2></div></div>
    <div class="stats">
      <div class="stat"><div class="v num ${w.lifts>=4?"good":""}">${w.lifts}<span class="small muted">/4</span></div><div class="k">Lifts</div></div>
      <div class="stat"><div class="v num ${w.cardio>=2?"good":""}">${w.cardio}<span class="small muted">/2-3</span></div><div class="k">Cardio</div></div>
      <div class="stat"><div class="v num">${w.logged.length?w.under+"/"+w.logged.length:"—"}</div><div class="k">Days ≤${s.carbs} g carbs</div></div>
    </div>
    ${w.stepDays?`<div class="small muted">Steps: <b class="num" style="color:var(--ink)">${fmtK(w.stepAvg)}</b> a day on average (${w.stepDays} day${w.stepDays>1?"s":""} entered).</div>`:""}
    ${weekBars(w)}
    <div class="legend"><span><i class="sw def"></i>Deficit (kcal)</span><span><i class="sw sur"></i>Surplus</span><span class="muted">LIFT / CARDIO = trained that day</span></div>
    <div class="small muted">${w.logged.filter(r=>r.date<today()).length?`Net so far this week: ${w.balSum<=0?"deficit":"surplus"} of ${fmtK(Math.abs(w.balSum))} kcal, roughly ${r1(Math.abs(w.balSum)/3500)} lb of fat.`:"Finish a full day of logging to see your first deficit bar."}${w.pAvg!=null?` Protein average ${Math.round(w.pAvg)} g.`:""}</div>
  </div>

  <div class="hud">
    <div class="spread"><div><div class="eyebrow">Projection</div><h2>Weight to ${s.goalWeight}</h2></div><span class="tag ${hasWeigh?"good":"warn"}"><i></i>${hasWeigh?"Using weigh-ins":"Estimated"}</span></div>
    <div class="stats">
      <div class="stat"><div class="v num">${r1(m.cur)}</div><div class="k">${hasWeigh?"Now, lb":"Est. now, lb"}</div></div>
      <div class="stat"><div class="v num">${m.lbWk!=null?r1(m.lbWk):"—"}</div><div class="k">Lb / week pace</div></div>
      <div class="stat"><div class="v num">${goalDate?fmtShort(goalDate):"—"}</div><div class="k">Goal date</div></div>
    </div>
    ${weightChart(m)}
    <div class="legend"><span><i class="sw ln"></i>${hasWeigh?"Trend":"Estimated weight"}</span><span><i class="sw lnp"></i>Projected</span>${hasWeigh?`<span><i class="sw wd"></i>Weigh-in</span>`:""}</div>
    <div class="small muted">${hasWeigh?"":`No weigh-ins yet, so this starts at ${s.startWeight} lb on ${fmtShort(s.startDate)} and subtracts logged calorie deficits (3,500 kcal ≈ 1 lb). `}Pace is your average daily deficit over the last 7 logged days. ${lost>0?`Down about ${r1(lost)} lb since you started. `:""}Early keto weeks also drop water, so the scale often moves faster than this at first. Add a morning weight on the Food tab to sharpen it.</div>
  </div>

  <div class="hud">
    <div class="spread"><div><div class="eyebrow">Ketosis</div><h2>Urine strip readings</h2></div>
      <div class="toggle" role="group" aria-label="Chart range"><button data-kv="day" class="${dash.kView==="day"?"sel":""}" aria-pressed="${dash.kView==="day"}">14 days</button><button data-kv="week" class="${dash.kView==="week"?"sel":""}" aria-pressed="${dash.kView==="week"}">8 weeks</button></div></div>
    ${ketoneChart(m)}
    <button class="primary" id="kPhoto"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" style="vertical-align:-4px;margin-right:6px"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo of ketone strip</button>
    <div><div class="small muted" style="margin-bottom:6px">Or tap the color it matched</div><div class="chips">${KLEVELS.map(x=>`<button class="cat kq" data-klev="${x.k}"><i class="sw k${KIDX[x.k]}"></i>${x.l}</button>`).join("")}</div></div>
    ${ketones().filter(k=>k.date===today()).length?`<div class="small muted">Today: ${ketones().filter(k=>k.date===today()).map(k=>`${KLEVELS[KIDX[k.level]].l} <button class="xbtn" data-kdel="${esc(k.id)}" aria-label="Delete reading">×</button>`).join(" · ")}</div>`:""}
  </div>

  <div class="hud">
    <div class="eyebrow">Rest of the week</div><h2>Suggestions</h2>
    <ul class="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    ${dash.plan&&dash.plan.date===today()?`<div class="plan">${dash.plan.headline?`<div class="banner">${esc(dash.plan.headline)}</div>`:""}${(dash.plan.days||[]).map(d=>`<div class="pday"><div class="eyebrow">${esc(d.day)}</div><div><b>Train:</b> ${esc(d.train||"")}</div><div><b>Eat:</b> ${esc(d.eat||"")}</div>${d.note?`<div class="small muted">${esc(d.note)}</div>`:""}</div>`).join("")}</div>`:""}
    ${dash.planErr?`<div class="small" style="color:var(--bad)">${esc(dash.planErr)}</div>`:""}
    <button id="planBtn" ${dash.planLoading?"disabled":""}>${dash.planLoading?"Building your plan…":dash.plan&&dash.plan.date===today()?"Rebuild day-by-day plan":"Get a day-by-day plan from Claude"}</button>
  </div>`;
  el.querySelectorAll("[data-kv]").forEach(b=>b.onclick=()=>{dash.kView=b.dataset.kv;render()});
  $("#kPhoto",el).onclick=()=>$("#camKetone").click();
  el.querySelectorAll("[data-klev]").forEach(b=>b.onclick=()=>saveKetone(b.dataset.klev,"manual"));
  el.querySelectorAll("[data-kdel]").forEach(b=>b.onclick=()=>{put(b.dataset.kdel,null);toast("Reading deleted")});
  $("#planBtn",el).onclick=()=>buildPlan(m,w);
}
function saveKetone(level,src){ const now=Date.now(); put("k-"+now,{kind:"ketone",date:today(),ts:new Date(now).toISOString(),level,mmol:KLEVELS[KIDX[level]].mmol,src}); toast(`Ketones: ${KLEVELS[KIDX[level]].l} saved`); }
async function onKetonePhoto(file){
  if(!file) return;
  openSheet({kind:"ketone",title:"Ketone strip",status:"loading",loadingText:"Reading the strip color…"});
  const s=sheet;
  try{ const img=await shrink(file,1400); s.photoUrl=img.url; s.images=[img.blob]; drawSheet(); }catch(e){ s.status=""; s.error="That photo couldn't be opened. Try again."; drawSheet(); return; }
  const run=async()=>{ s.status="loading"; s.error=""; drawSheet();
    const prompt=`The photo shows a urine ketone test strip (acetoacetate), possibly held next to the color chart on its bottle. Judge the color of the strip's test pad (beige = negative, light pink = trace, pink = small, maroon = moderate, deep purple = large or very large). If the bottle's chart is visible, match against it. Lighting can shift colors; say so if unsure.
Respond with only JSON: {"level": "negative" | "trace" | "small" | "moderate" | "large" | "very large", "confidence": "high" | "medium" | "low", "note": string (one short plain sentence)}`;
    try{ const out=await askClaude(prompt,s.images); if(sheet!==s) return; s.level=KIDX[out.level]!=null?out.level:"small"; s.note=(out.confidence?`Confidence: ${out.confidence}. `:"")+(out.note||""); s.status=""; }
    catch(e){ if(sheet!==s) return; s.status=""; s.error=aiError(e); }
    drawSheet(); };
  s.retry=run; run();
}
async function buildPlan(m,w){
  const s=settings(); dash.planLoading=true; dash.planErr=""; render();
  const daysLeft=w.days.filter(d=>d>=today()).map(d=>parseYmd(d).toLocaleDateString(undefined,{weekday:"long"}));
  const recent=m.rows.filter(r=>r.date>=w.mon).map(r=>`${r.date}: ${r.logged?`${fmtK(r.t.kcal)} kcal, ${Math.round(r.t.p)}P/${r1(r.t.c)}C/${Math.round(r.t.f)}F, burn ~${fmtK(r.burn)}`:"no food logged"}; training: ${r.ex.items.join(", ")||"none"}; ketones: ${r.ket?r.ket.level:"not tested"}`).join("\n");
  const prompt=`${ctxText()}
His program: 4 lifts a week rotating Lower 1, Upper 1, Lower 2, Upper 2, plus 2-3 cardio sessions (incline walks). Week ${weekNo(today())}, phase: ${phase(weekNo(today())).name}. Next lift in rotation: ${WMAP[nextWorkoutId()].name}.
Targets: ${s.proteinMin}-${s.protein} g protein, max ${s.carbs} g net carbs, ~${s.fat} g fat, ${s.water} oz water.
This week so far (lifts done ${w.lifts}/4, cardio ${w.cardio}):
${recent}
Days left this week, including today: ${daysLeft.join(", ")}.
Write a short, practical plan for each remaining day: which workout (or rest/cardio), and what to eat (specific foods, protein-first, keto). Be encouraging but direct.
Respond with only JSON: {"headline": string (one sentence), "days": [{"day": string, "train": string, "eat": string, "note": string}]}`;
  try{ const out=await askClaude(prompt); dash.plan={...out,date:today()}; lsSet("lk-plan",dash.plan); }
  catch(e){ dash.planErr=aiError(e); }
  dash.planLoading=false; render();
}

$("#camKetone").onchange=e=>{ onKetonePhoto(e.target.files[0]); e.target.value=""; };
$("#camSteps").onchange=e=>{ onStepsShot(e.target.files[0]); e.target.value=""; };
let deferred=false;
function render(){
  setSync(mode);
  const t=ui.tab||"status";
  // don't wipe what you're typing on Food or Find when a sync arrives; redraw when you leave the field
  const a=document.activeElement, v=$("#v-"+t);
  if((t==="food"||t==="find"||t==="status")&&a&&v&&v.contains(a)&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&!/checkbox|file|date/.test(a.type)))){ deferred=true; return; }
  deferred=false;
  if(t==="status") renderStatus(); else if(t==="train") renderTrain(); else if(t==="food") renderFood(); else if(t==="find") renderFind(); else if(t==="log") renderLog(); else renderMore();
}
document.addEventListener("focusout",()=>{ if(deferred) setTimeout(()=>{ if(deferred&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&$("#v-"+ui.tab).contains(document.activeElement))) render(); },0); });
// keep "today" fresh if the app stays open past midnight
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ if(foodDate>today()) foodDate=today(); render(); }});
window.APP={saveSteps,day,put,render,toast,today,addDays,settings,view};
setTab(draft?"train":"status");
connect();
})();
